name: CI

on:
  workflow_dispatch:
  # A draft pull request does not run the jobs: every job is gated on
  # draft == false, and ready_for_review is what starts them. Marking a pull
  # request ready counts as an event of its own, so nothing has to be pushed
  # again to get a first run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust core
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust
      # rustfmt.toml uses nightly-only options (import grouping, comment
      # wrapping). RUSTUP_TOOLCHAIN overrides rust-toolchain.toml for this step
      # only.
      - name: Format
        run: cargo fmt --all --check
        env:
          RUSTUP_TOOLCHAIN: nightly
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      # Also validates devices/*.yaml and runs the conformance vectors in
      # tests/fixtures/golden/.
      - name: Test
        run: cargo test --all-features
      - name: Documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      # Verifies the rust-version declared in Cargo.toml is actually honored.
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust
      - run: cargo check --workspace --all-features
        env:
          RUSTUP_TOOLCHAIN: "1.88.0"

  lint:
    name: Spelling and file length
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@master
      - run: ./tools/check-file-length.sh

  deny:
    name: Licenses and advisories
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: packages/rust/Cargo.toml
          command: check

  python:
    name: Python
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # TODO: enable once packages/python has code — it will wrap the Rust core
      # through PyO3, so this job builds a wheel rather than running a port.
      - run: 'echo "TODO: python binding"'

  node:
    name: Node
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # TODO: enable once packages/node has code — napi-rs binding over the Rust
      # core.
      - run: 'echo "TODO: node binding"'

  php:
    name: PHP
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      # TODO: enable once packages/php has code. PHP is a hand-written port, so
      # this job must also run tests/fixtures/golden/ — that is what keeps it
      # from drifting away from the core.
      - run: 'echo "TODO: php port"'

  docs:
    name: Documentation
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TODO: regenerate the docs/compatibility.md tables from devices/*.yaml
      # and fail if they drift.
      - run: 'echo "TODO: compatibility.md drift check"'

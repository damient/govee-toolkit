name: CI

on:
  workflow_dispatch:
  # A draft pull request does not run the jobs: every job is gated on
  # draft == false, and ready_for_review is what starts them. Marking a pull
  # request ready counts as an event of its own, so nothing has to be pushed
  # again to get a first run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. Pushes to main
# are never cancelled: every commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Third-party actions are pinned to a commit SHA, not a tag: a tag is mutable
# and these workflows check out the repository. Dependabot bumps the SHAs.
# The repository settings also allow only a listed set of owners, so a new
# action means adding a pattern under Settings > Actions before it will run.

jobs:
  rust:
    name: Rust core (${{ matrix.os }})
    if: github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The `lan` transport is UDP multicast on socket2 with one reused
        # socket, and SO_REUSEADDR, interface selection and loopback of one's
        # own datagrams differ on each of the three. The in-process simulator
        # makes that testable without hardware, so it is tested.
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/rust
        # The steps below use POSIX shell syntax; Windows would otherwise run
        # them through PowerShell.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        if: matrix.os == 'ubuntu-latest'
        with:
          toolchain: nightly
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/rust
      # fmt, clippy and doc are platform-independent — running them once on
      # Linux costs a third of running them three times.
      # rustfmt.toml uses nightly-only options (import grouping, comment
      # wrapping). RUSTUP_TOOLCHAIN overrides rust-toolchain.toml for this step
      # only.
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
        env:
          RUSTUP_TOOLCHAIN: nightly
      # btleplug reaches BlueZ over D-Bus, so the `ble` feature needs the dbus
      # headers to compile here. macOS and Windows carry their radio stack in
      # the platform SDK and need nothing.
      - name: D-Bus headers
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Also validates devices/*.yaml and runs the conformance vectors in
      # tests/fixtures/golden/.
      - name: Test
        run: cargo test --workspace --all-features
      # The codec has to keep building on its own: no socket, no async runtime.
      # `tools/check-no-io.sh` guards the imports, this guards the build.
      - name: Codec alone
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --no-default-features
      - name: Documentation
        if: matrix.os == 'ubuntu-latest'
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      # What docs.rs runs: the features and the flags from
      # `[package.metadata.docs.rs]`, on the nightly rustdoc it builds with.
      # `doc(cfg(...))` is nightly-only, so this step is where a broken
      # published build is caught, rather than the docs.rs log after a release.
      - name: docs.rs build
        if: matrix.os == 'ubuntu-latest'
        run: cargo doc --no-deps --all-features
        env:
          RUSTUP_TOOLCHAIN: nightly
          RUSTDOCFLAGS: --cfg docsrs -D warnings

  msrv:
    name: MSRV
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Read from the manifest, so raising rust-version raises what CI checks.
      - id: msrv
        run: |
          version=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          # An empty match would install the default toolchain and pass without
          # having checked the MSRV at all.
          [ -n "$version" ] || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/rust
      # btleplug reaches BlueZ over D-Bus, so `--all-features` needs the dbus
      # headers to compile.
      - name: D-Bus headers
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - run: cargo check --workspace --all-features
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}

  lint:
    name: Spelling, shell, file length and layering
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53 # v1.50.2
      # -x follows `# shellcheck source=`, which is how tools/lib/qa.sh is read.
      - name: Lint the shell scripts
        run: shellcheck -x tools/*.sh tools/lib/*.sh
      # The shfmt version is pinned as well as the action: a later one that
      # formats a line differently would fail the job on code nobody touched.
      - uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1
        with:
          shfmt-version: 3.14.1
      # No -ci: a case branch is not indented in this repository.
      - name: Check the shell formatting
        run: shfmt -d -i 2 tools/*.sh tools/lib/*.sh
      - run: ./tools/check-file-length.sh
      - run: ./tools/check-no-io.sh

  catalog:
    name: Device catalog artifact
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/rust
      - name: Check for duplicated command layouts
        working-directory: packages/rust
        run: cargo run -p xtask -- dupes
      # devices/*.yaml stays the source of truth; this is the single file a
      # third-party tool reads instead of the directory. It is
      # generated, never committed, and attached to a release.
      - name: Generate dist/catalog.json
        working-directory: packages/rust
        run: cargo run -p xtask
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog
          path: dist/catalog.json
          if-no-files-found: error

  captures:
    name: Capture redaction
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A capture that reaches main keeps its MAC addresses and tokens in the
      # history for good, so this runs before the merge, not after.
      - run: ./tools/check-captures.sh

  dco:
    name: DCO sign-off
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole range between base and head has to be walkable.
          fetch-depth: 0
      - name: Every commit carries Signed-off-by
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            author=$(git show -s --format='%an <%ae>' "$sha")
            # A bot cannot certify the DCO: it acts for the repository, and
            # what it opens is a version bump nobody wrote.
            case $author in
            *"[bot]"*) continue ;;
            esac
            if ! git show -s --format='%B' "$sha" \
              | grep -qiF "Signed-off-by: $author"; then
              echo "::error::$sha has no 'Signed-off-by: $author'"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Fix the branch with: git rebase --signoff main"
            exit 1
          fi

  commits:
    name: Commit convention
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      # Commits reachable from this one predate the convention and are skipped.
      # Emptying the variable checks the whole range.
      GRANDFATHERED: bd87443d8bc4ed95257241ee804168d2c49129af
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole range between base and head has to be walkable.
          fetch-depth: 0
      - name: Every commit subject is a conventional commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          types='feat|fix|perf|refactor|docs|test|build|ci|chore|revert'
          bad=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if [ -n "$GRANDFATHERED" ] \
              && git cat-file -e "$GRANDFATHERED^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$sha" "$GRANDFATHERED"; then
              continue
            fi
            subject=$(git show -s --format='%s' "$sha")
            if ! printf '%s' "$subject" \
              | grep -qE "^($types)(\([a-z0-9-]+\))?!?: .+"; then
              echo "::error::$sha: $subject"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "A subject is <type>(<scope>)!: <summary>, types $types."
            echo "See CONTRIBUTING.md, 'Commit messages'."
            exit 1
          fi

  changelog:
    name: Changelog entry
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.draft != true
      && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: A change to the code or the catalog carries an entry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          needs_entry=$(printf '%s\n' "$changed" \
            | grep -E '^(packages/[^/]+/(crates/[^/]+/)?(src/|build.rs)|devices/[^/]+\.yaml)' \
            || true)
          if [ -z "$needs_entry" ]; then
            echo "No code or catalog change in this range."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -q 'CHANGELOG\.md$'; then
            echo "Entry present."
            exit 0
          fi
          echo "::error::this range changes code or the catalog and no CHANGELOG.md"
          echo "A package's behavior goes in packages/<pkg>/CHANGELOG.md, the"
          echo "catalog in the root CHANGELOG.md. Run /changelog, or label the"
          echo "pull request 'no-changelog' when an entry is genuinely not owed."
          exit 1

  semver:
    name: Semver
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # btleplug reaches BlueZ over D-Bus, so `--all-features` needs the dbus
      # headers to compile.
      - name: D-Bus headers
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      # The baseline is the crate on crates.io. A change to the public API that
      # the version in Cargo.toml does not account for fails here rather than
      # on a registry that never takes a version back. Pre-1.0, the breaking
      # bump is the minor one — see docs/versioning.md.
      - uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: govee-toolkit
          manifest-path: packages/rust/Cargo.toml

  deny:
    name: Licenses and advisories
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: packages/rust/Cargo.toml
          command: check

  python:
    name: Python
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    # packages/python carries no rust-toolchain.toml, and the nightly step
    # below installs last, which makes nightly the default toolchain. Every
    # step that is not the format check runs on stable.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The floor and the newest release. The last line is the default
          # interpreter, and the wheel is built on the floor. The others stay
          # on PATH as `python<version>`, which the test step calls.
          python-version: |
            3.14
            3.11
          # The wheel is never installed from the index, so the cache holds
          # the check tools alone.
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/python
      # packages/python is a workspace of its own, so these run inside it.
      # rustfmt.toml uses nightly-only options.
      - name: Format the Rust binding
        run: cargo fmt --all --check
        env:
          RUSTUP_TOOLCHAIN: nightly
      - name: Lint the Rust binding
        run: cargo clippy --all-targets --all-features -- -D warnings
      - run: pip install maturin ruff mypy
      # ruff and mypy read the sources, so they run before the wheel exists.
      - name: Format the Python sources
        run: ruff format --check govee_toolkit tests ../../tools ../../site/tools
      - name: Lint the Python sources
        run: ruff check govee_toolkit tests ../../tools ../../site/tools
      # The package ships py.typed, so a user's type checker reads these stubs.
      - name: Type-check the Python sources
        run: mypy
      # The wheel is built here rather than at release time: a manifest that
      # cannot produce one is a release that fails after the tag is signed and
      # pushed. It is built and installed, not `maturin develop`, so the check
      # runs on what a user gets.
      - name: Build the wheel
        run: maturin build --out target/wheels
      # abi3 claims the wheel imports on the floor and up; this checks it.
      # Each version gets an environment of its own, so the absolute path to
      # `pytest` selects the interpreter.
      # `pytest`, not `python -m pytest`: the second puts the working directory
      # first on the import path, and `govee_toolkit/` there holds the Python
      # half of the package without the extension module beside it.
      - name: Test the wheel on each supported interpreter
        run: |
          for version in 3.11 3.14; do
            echo "::group::Python $version"
            python$version -m venv "$RUNNER_TEMP/venv-$version"
            venv="$RUNNER_TEMP/venv-$version/bin"
            "$venv/pip" install pytest pytest-asyncio
            "$venv/pip" install --no-index --no-deps target/wheels/*.whl
            "$venv/pytest"
            echo "::endgroup::"
          done
      # The binding owns the prose; stubtest checks the types, not the text.
      - name: Check the stub prose against the binding
        run: ./tools/sync-stubs.py --check
        working-directory: .
      # mypy reads the stubs and believes them. stubtest imports the built
      # module and compares it against them, so a signature that drifted fails
      # here and not in a user's editor. It needs the wheel installed.
      # -P keeps the working directory off sys.path. Without it `-m` imports
      # the `govee_toolkit/` directory here, which has no extension module
      # beside it, in place of the wheel installed in the environment.
      - name: Check the stubs against the built module
        run: |
          "$RUNNER_TEMP/venv-3.11/bin/pip" install mypy
          "$RUNNER_TEMP/venv-3.11/bin/python" -P -m mypy.stubtest govee_toolkit \
            --concise

  node:
    name: Node
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node
    # The nightly step below installs last, which makes nightly the default
    # toolchain. Every step but the format check runs on stable.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/node/package-lock.json
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/node
      - name: Format the Rust binding
        run: cargo fmt --all --check
        env:
          RUSTUP_TOOLCHAIN: nightly
      - name: Lint the Rust binding
        run: cargo clippy --all-targets --all-features -- -D warnings
      - run: npm ci
      # The debug profile: what this build produces is read by the two steps
      # below and by nothing else, and the release profile takes minutes on
      # this crate. The release workflow builds the addon that ships.
      - name: Build the addon and the types
        run: npm run build:debug
      # The addon loader and the type definition are generated from the
      # binding and committed, so a signature that drifted fails here rather
      # than in a user's editor.
      - name: The generated binding is in step with the Rust sources
        run: git diff --exit-code -- binding.cjs binding.d.cts
      - run: npm test

  docs:
    name: Documentation
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/rust
      # The two tables in docs/compatibility.md are generated from
      # devices/*.yaml. A device file merged without regenerating them leaves
      # the page saying something the data does not.
      - name: docs/compatibility.md is in step with devices/
        working-directory: packages/rust
        run: cargo run -p xtask -- compat --check
      # docs/dmx-profiles.md is the same data through the DMX channel table.
      # A device file that changed a range or a zone count moves the page.
      - name: docs/dmx-profiles.md is in step with devices/
        working-directory: packages/rust
        run: cargo run -p xtask -- dmx --check

# Publishes govee-toolkit-server from packages/rust/crates/server. Triggered
# by a server-vX.Y.Z tag.
name: Server release

on:
  workflow_dispatch:
  push:
    tags: ["server-v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # crates.io trusted publishing
      contents: write   # create the GitHub release
      actions: read     # read the CI run of the tagged commit
    defaults:
      run:
        working-directory: packages/rust/crates/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CI passed on this commit
        if: github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci-passed.sh "$GITHUB_SHA"
      # The tag, the manifest version and the changelog heading have to carry
      # the same number before anything is built or published.
      - name: Tag, manifest and changelog agree
        if: github.event_name == 'push'
        working-directory: .
        run: |
          tools/release-notes.sh server "$GITHUB_REF_NAME" \
            > "$RUNNER_TEMP/notes.md"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      # crates.io keeps a version forever, and a tag moved to a new commit
      # reruns this job. A version already up is skipped rather than failing
      # the run on an upload crates.io would refuse anyway.
      - name: Is this version already on crates.io?
        id: crate
        run: |
          version=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml \
            | head -1)
          if curl -sfo /dev/null \
            -H "User-Agent: govee-toolkit release (github.com/damient)" \
            "https://crates.io/api/v1/crates/govee-toolkit-server/$version"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # The dependency on `govee-toolkit` carries a path and a version. cargo
      # uploads the version, so `cargo publish` fails on a core that is not up
      # yet. Reading the registry first says which release is missing instead
      # of failing inside the upload — publish `rust-vX.Y.Z` first.
      - name: The core it needs is on crates.io
        if: steps.crate.outputs.published == 'false'
        run: |
          core=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' ../../Cargo.toml \
            | head -1)
          if ! curl -sfo /dev/null \
            -H "User-Agent: govee-toolkit release (github.com/damient)" \
            "https://crates.io/api/v1/crates/govee-toolkit/$core"; then
            echo "::error::govee-toolkit $core is not on crates.io" >&2
            echo "Publish rust-v$core before this tag." >&2
            exit 1
          fi
      # build.rs embeds the web UI. The crate on crates.io reads it from `web/`,
      # because `cargo package` cannot reach apps/studio above the manifest.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.crate.outputs.published == 'false'
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Build the web UI
        if: steps.crate.outputs.published == 'false'
        working-directory: apps/studio
        run: npm ci && npm run build
      - name: Vendor the web UI
        if: steps.crate.outputs.published == 'false'
        run: cp -R ../../../../apps/studio/dist web
      # A vendoring step that did nothing would ship a binary with no UI, so
      # the file list is read before the upload.
      - name: The upload carries the web UI
        if: steps.crate.outputs.published == 'false'
        run: |
          cargo package --list --allow-dirty > "$RUNNER_TEMP/files.txt"
          grep -qx 'web/index.html' "$RUNNER_TEMP/files.txt"
          grep -qx 'web/app.js' "$RUNNER_TEMP/files.txt"
      # The binary carries `ble` by default, and btleplug reaches BlueZ over
      # D-Bus, so the verification build of `cargo publish` needs the dbus
      # headers.
      - name: D-Bus headers
        if: steps.crate.outputs.published == 'false'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      # Trusted publishing: crates.io trades this job's OIDC identity for a
      # short-lived token, so no registry token lives in the repository.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
        if: steps.crate.outputs.published == 'false'
      - name: Publish
        if: steps.crate.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # `web/` is vendored in and git-ignored, which cargo reads as a dirty
        # tree.
        run: cargo publish --allow-dirty
      - name: GitHub release
        if: github.event_name == 'push'
        uses: ./.github/actions/github-release
        with:
          notes: ${{ runner.temp }}/notes.md

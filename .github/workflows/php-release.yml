# Releases packages/php. Triggered by a php-vX.Y.Z tag.
# Packagist pulls from the repo, so this workflow validates and notifies.
name: PHP release

# Manual only until the package is publishable. Restore the tag trigger with
# the first real release.
on:
  workflow_dispatch:
  # push:
  #   tags: ["php-v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.2"
      # TODO: enable once packages/php is publishable
      # - run: composer validate --working-dir=packages/php
      # - name: Notify Packagist
      #   run: echo "TODO: call the Packagist update hook"
      - run: 'echo "TODO: validate and publish packages/php"'

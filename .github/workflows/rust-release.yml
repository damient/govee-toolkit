# Publishes govee-toolkit from packages/rust. Triggered by a rust-vX.Y.Z tag.
name: Rust release

on:
  workflow_dispatch:
  push:
    tags: ["rust-v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag, the manifest version and the changelog heading have to carry
      # the same number before anything is built or published.
      - name: Tag, manifest and changelog agree
        if: github.event_name == 'push'
        working-directory: .
        run: |
          tools/release-notes.sh rust "$GITHUB_REF_NAME" \
            > "$RUNNER_TEMP/notes.md"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      # `govee-toolkit` is the one crate published; crates/sim and crates/xtask
      # are publish = false and are reached only as path-only dev-dependencies,
      # which cargo drops from the upload.
      #
      # build.rs embeds devices/*.yaml, which sits above the manifest and so
      # cannot be packaged from there. Vendor it in first, and check the
      # --dry-run file list: it must carry devices/*.yaml and no crates/.
      # - name: Vendor the device catalog
      #   run: cp -R ../../devices devices
      # - run: cargo publish
      #   env:
      #     CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      # TODO: enable once there is something to publish.
      - run: 'echo "TODO: vendor devices/ and publish govee-toolkit"'
      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

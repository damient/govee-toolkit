# Publishes the crates in packages/rust. Triggered by a rust-vX.Y.Z tag.
name: Rust release

# Manual only until the crates are publishable. Restore the tag trigger with
# the first real release.
on:
  workflow_dispatch:
  # push:
  #   tags: ["rust-v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # TODO: enable once the crates are publishable. govee-core embeds
      # devices/*.yaml, which sits outside the package — vendor it into the
      # crate directory here and point GOVEE_DEVICES_DIR at the copy, otherwise
      # the published crate will not build.
      # - run: cargo publish -p govee-core
      #   env:
      #     CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: 'echo "TODO: vendor devices/ and publish govee-core"'

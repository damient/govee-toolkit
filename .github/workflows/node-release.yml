# Publishes packages/node. Triggered by a node-vX.Y.Z tag.
name: Node release

# Manual only until the package is publishable. Restore the tag trigger with
# the first real release.
on:
  workflow_dispatch:
  # push:
  #   tags: ["node-v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # TODO: enable once packages/node is publishable
      # - run: npm ci --prefix packages/node
      # - run: npm run build --prefix packages/node
      # - run: npm publish --prefix packages/node --provenance
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: 'echo "TODO: build and publish packages/node"'

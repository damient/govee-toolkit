# Publishes packages/node. Triggered by a node-vX.Y.Z tag.
name: Node release

on:
  workflow_dispatch:
  push:
    tags: ["node-v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write   # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The tag, the manifest version and the changelog heading have to carry
      # the same number before anything is built or published.
      - name: Tag, manifest and changelog agree
        if: github.event_name == 'push'
        run: |
          tools/release-notes.sh node "$GITHUB_REF_NAME" \
            > "$RUNNER_TEMP/notes.md"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm 11.5.1 or newer; node 24 ships past that.
      - run: npm ci
        working-directory: packages/node
      - run: npm run build
        working-directory: packages/node
      # npm keeps a version forever, and a tag moved to a new commit reruns
      # this job. A version already up is skipped rather than failing the run
      # on an upload npm would refuse anyway.
      - name: Is this version already on npm?
        id: npm
        working-directory: packages/node
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "govee-toolkit@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # Trusted publishing: npm trades this job's OIDC identity for a
      # short-lived token, so no registry token lives in the repository. It
      # also signs the provenance attestation, hence no `--provenance` flag.
      - name: Publish
        if: steps.npm.outputs.published == 'false'
        working-directory: packages/node
        run: npm publish
      - name: GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag moved to a new commit reruns this job against a release that
          # already exists, which `create` reports as a validation failure.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi

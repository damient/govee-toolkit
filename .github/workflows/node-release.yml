# Publishes packages/node. Triggered by a node-vX.Y.Z tag.
name: Node release

# Manual only until the package is publishable. Restore the tag trigger with
# the first real release.
on:
  workflow_dispatch:
  # push:
  #   tags: ["node-v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      # TODO: enable once packages/node is publishable

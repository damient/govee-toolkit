# Publishes packages/python. Triggered by a python-vX.Y.Z tag.
name: Python release

# Manual only until the package is publishable. Restore the tag trigger with
# the first real release.
on:
  workflow_dispatch:
  # push:
  #   tags: ["python-v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # PyPI trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # TODO: enable once packages/python is publishable
      # - run: pip install build && python -m build packages/python
      # - uses: pypa/gh-action-pypi-publish@release/v1

version: 2

# One pull request per weekly run, for every ecosystem and directory.
# A multi-ecosystem group does not take security updates: each entry
# groups its own under `security`.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: "build"
      include: scope

updates:
  - package-ecosystem: cargo
    directory: /packages/rust
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /packages/python
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /packages/node
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /packages/python
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  # Actions are pinned to commit SHAs in .github/workflows/. Dependabot reads
  # the version from the trailing comment and rewrites both.
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: npm
    directory: /packages/node
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /site
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/desktop
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/playground/server
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /integrations/homebridge
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /integrations/mcp
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]

version: 2

updates:
  - package-ecosystem: cargo
    directory: /packages/rust
    commit-message:
      prefix: "build"
      include: scope
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor:
        update-types: [minor, patch]

  # Actions are pinned to commit SHAs in .github/workflows/. Dependabot reads
  # the version from the trailing comment and rewrites both.
  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "ci"
      include: scope
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /packages/node
    commit-message:
      prefix: "build"
      include: scope
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      node-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /packages/artnet-dmx-bridge
    commit-message:
      prefix: "build"
      include: scope
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      artnet-dmx-bridge-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/desktop
    commit-message:
      prefix: "build"
      include: scope
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      desktop-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/playground/server
    commit-message:
      prefix: "build"
      include: scope
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      playground-server-minor:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /integrations/homebridge
    commit-message:
      prefix: "build"
      include: scope
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      homebridge-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /packages/python
    commit-message:
      prefix: "build"
      include: scope
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor:
        update-types: [minor, patch]

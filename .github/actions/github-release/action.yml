# The last step of every release workflow. The job needs `contents: write`.
name: GitHub release
description: Create the release of the pushed tag, with the given notes.
inputs:
  notes:
    description: The file that holds the release notes.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        NOTES: ${{ inputs.notes }}
      run: |
        # A tag moved to a new commit reruns the job, and `create` fails on a release that exists.
        if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
          gh release edit "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$NOTES"
        else
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$NOTES"
        fi

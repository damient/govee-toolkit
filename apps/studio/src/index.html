<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <!-- Before the first paint, so that a light theme does not show dark first. prefs.ts keeps this copy of the theme that the server stores. -->
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem("studio.theme") ?? "dark"; } catch {}
  </script>
  <title>Govee Toolkit Studio</title>
  <meta name="theme-color" content="#0a0d14">
  <!-- Added to the home screen, Studio opens without the browser bars. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Studio">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="splash" id="splash" role="status" aria-live="polite">
    <span class="dots wave" aria-hidden="true"><i></i><i></i><i></i></span>
    <h1 class="splash-title wordmark">Studio</h1>
    <p class="splash-sub">Govee Toolkit</p>
    <p class="splash-note" id="splash-note"></p>
  </div>

  <div class="app">
    <aside class="rail">
      <div class="rail-head">
        <a class="brand" href="/" aria-label="Home" data-i18n-label="brand.home">
          <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="wordmark">Studio</span>
        </a>
        <button class="collapse" id="collapse" type="button" aria-label="Collapse the sidebar"></button>
      </div>
      <nav class="nav" id="nav" aria-label="Main"></nav>
    </aside>
    <main class="view" id="view"></main>
  </div>
</body>
</html>

[package]
name = "govee-toolkit-desktop"
description = "Govee Toolkit Studio on Windows, macOS and Linux: control Govee lights from a desktop app."
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/damient/govee-toolkit"
authors = ["damient"]
publish = false

# Outside the packages/rust workspace: the webview links to WebKitGTK on Linux.
[workspace]

[build-dependencies]
tauri-build = "2"

[dependencies]
govee-toolkit-server = { path = "../../../packages/rust/crates/server" }
tauri = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

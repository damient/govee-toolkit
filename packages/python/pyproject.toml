# The wheel carries a compiled extension module, so the backend is maturin.
[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "govee-toolkit"
# The number is written here and not taken from Cargo.toml:
# `tools/release-notes.sh` reads this line to check the tag, the manifest and
# the changelog against each other. Raise it here and in Cargo.toml together.
version = "0.4.0"
description = "Control Govee devices from your own network: undocumented LAN features, with BLE and Cloud modes when you need them."
authors = [{ name = "damient" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
keywords = ["govee", "led", "smart-home", "iot", "sdk"]
# maturin fills in the license and the platform rows. These are the ones it
# cannot know.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Rust",
  "Topic :: Home Automation",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://gvetk.com"
Documentation = "https://gvetk.com/docs/start/"
Repository = "https://github.com/damient/govee-toolkit"
Issues = "https://github.com/damient/govee-toolkit/issues"
Changelog = "https://github.com/damient/govee-toolkit/blob/main/packages/python/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.maturin]
# A mixed layout: `govee_toolkit/` next to this file is the Python package, and
# the crate builds the extension module inside it.
module-name = "govee_toolkit._govee_toolkit"
features = ["pyo3/extension-module"]

[tool.ruff]
# `tests/helpers.py` is imported as `helpers`, so the test directory is a source
# root. Without it the import sorter files the module under third-party.
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "PYI", "RUF"]
# PYI021 is a typeshed rule: a stub published apart from its package carries no
# docstring. These stubs ship inside the wheel, and an editor reads the
# documentation off them, so the docstrings stay. `tools/sync-stubs.py` writes
# them from the binding.
ignore = ["PYI021"]

[tool.mypy]
# The package ships `py.typed` and the stubs beside it, so what a user's type
# checker reads is checked here first.
strict = true
files = ["govee_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Every test is a coroutine: the package is asyncio only.
asyncio_mode = "auto"

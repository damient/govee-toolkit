# The options below the stable two are nightly-only. Format with
# `cargo +nightly fmt`. See ../../CONTRIBUTING.md.
edition = "2024"
max_width = 100

group_imports = "StdExternalCrate"
imports_granularity = "Module"
wrap_comments = true
comment_width = 80
format_code_in_doc_comments = true
normalize_doc_attributes = true

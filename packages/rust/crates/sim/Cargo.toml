[package]
name = "govee-toolkit-sim"
description = "A fake Govee device, on UDP and on GATT, so the transports can be tested without hardware."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["govee", "simulator", "bluetooth", "testing", "smart-home"]
categories = ["development-tools::testing", "network-programming"]
# Never published: it is a test fixture, and `govee-toolkit` depends on it only
# as a path-only dev-dependency, which `cargo publish` drops.
publish = false

[[bin]]
name = "govee-toolkit-sim"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
socket2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tracing.workspace = true
uuid = "1"

[lints]
workspace = true

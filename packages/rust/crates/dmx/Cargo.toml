[package]
name = "govee-toolkit-dmx"
description = "An Art-Net node over govee-toolkit: a lighting desk drives Govee devices on the LAN. Unofficial."
# Versioned apart from the crate it reads, and released under `dmx-vX.Y.Z` —
# see docs/versioning.md.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["govee", "dmx", "artnet", "lighting", "led"]
categories = ["command-line-utilities", "hardware-support"]

[[bin]]
name = "govee-dmx"
path = "src/main.rs"

[features]
# One input protocol is one feature. Art-Net is the one the node carries;
# sACN adds a parser and the same channel model — see docs/dmx.md.
default = ["artnet"]
artnet = []
sacn = []

[dependencies]
clap = { version = "4", features = ["derive"] }
# The bridge is an input, not a mode: it reaches a device over `lan`, the way
# any other caller does.
govee-toolkit = { path = "../..", version = "0.10", default-features = false, features = [
  "lan",
] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# The patch file, in the format the device files already use.
serde_norway = "0.9"
# `SO_REUSEADDR`, because port 6454 is fixed by the protocol: without it a
# second Art-Net application on the host cannot start.
socket2 = { workspace = true }
thiserror = "2"
# `signal` is what ends a run cleanly: the streams disarm, and the counters
# reach the operator.
tokio = { workspace = true, features = ["signal"] }
# `--debug` installs a subscriber. Without one the library writes its traces
# nowhere, and a stream that stops reports nothing.
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
] }

[dev-dependencies]
# A fake device on the loopback, so the send path is tested with no hardware.
govee-toolkit-sim = { path = "../sim" }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true

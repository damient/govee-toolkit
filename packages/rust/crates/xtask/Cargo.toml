[package]
name = "xtask"
description = "Repository tasks: generates the distributable device catalog."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# A repository task, not a library. Never published.
publish = false

[dependencies]
# The catalog is serialized from the types the SDK loads, so the two cannot
# disagree. `default-features = false` leaves the codec alone, with no
# transport and no async runtime.
# The channel table comes from the same build: the page this task writes is a
# view of `govee_toolkit::profile` and never a second derivation.
govee-toolkit = { path = "../..", default-features = false }
serde_json.workspace = true
serde_norway = "0.9"
# `xtask api` reads the Rust and CLI surfaces from their source. `printing`,
# on by default, is what turns a parsed type back into text.
quote = "1"
syn = { version = "2", features = ["full"] }

[lints]
workspace = true

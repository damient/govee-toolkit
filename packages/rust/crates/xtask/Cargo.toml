[package]
name = "xtask"
description = "Repository tasks: generates the distributable device catalog."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# A repository task, not a library. Never published.
publish = false

[dependencies]
# The catalog is serialized from the types the SDK loads, so the generated
# file and the SDK cannot disagree. `default-features = false` leaves the
# codec on its own: no transport, no async runtime.
govee-toolkit = { path = "../..", default-features = false }
serde_json.workspace = true
serde_norway = "0.9"

[lints]
workspace = true

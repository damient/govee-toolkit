[package]
name = "govee-toolkit-cli"
description = "Command line interface to govee-toolkit: discover Govee devices and send commands over the LAN, over Bluetooth or through the cloud. Unofficial."
# Versioned apart from the crate it wraps, and released under `cli-vX.Y.Z` —
# see docs/versioning.md.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["govee", "cli", "led", "smart-home", "iot"]
categories = ["command-line-utilities", "hardware-support"]

[[bin]]
name = "govee"
path = "src/main.rs"

[features]
default = ["lan"]
# Each feature forwards to the same feature of the library, so a build of the
# CLI carries the transports it was asked for and no other.
lan = ["govee-toolkit/lan"]
ble = ["govee-toolkit/ble"]
cloud = ["govee-toolkit/cloud"]

[dependencies]
clap = { version = "4", features = ["derive"] }
govee-toolkit = { path = "../..", version = "0.6", default-features = false }
serde_json.workspace = true
tokio = { workspace = true, features = [
  "io-std",
  "io-util",
  "rt-multi-thread",
  "sync",
  "time",
] }

[lints]
workspace = true

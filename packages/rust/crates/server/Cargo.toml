[package]
name = "govee-toolkit-server"
description = "Govee Toolkit Studio: take full control of your Govee lights from a browser."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["govee", "govee-api", "lan", "lighting", "dashboard"]
categories = ["web-programming::http-server", "hardware-support"]
# `web/` is the Studio build that the release workflow copies here.
include = ["src/**", "build.rs", "web/**", "README.md"]

[[bin]]
name = "govee-server"
path = "src/main.rs"

[features]
default = ["lan", "ble", "cloud"]
lan = ["govee-toolkit/lan"]
ble = ["govee-toolkit/ble"]
cloud = ["govee-toolkit/cloud"]

[dependencies]
axum = { version = "0.8", default-features = false, features = [
  "http1",
  "json",
  "tokio",
] }
clap = { version = "4", features = ["derive"] }
govee-toolkit = { path = "../..", version = "1.17", default-features = false }
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
serde_norway = "0.9"
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true

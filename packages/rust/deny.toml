# cargo-deny — enforces the repository's licensing rule: MIT, no copyleft
# dependencies (see ../../CONTRIBUTING.md).

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive only. MPL-2.0, LGPL and GPL are deliberately absent: a copyleft
# dependency would contaminate the redistribution terms of every SDK built on
# this core, bindings included.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

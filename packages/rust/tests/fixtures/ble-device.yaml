# A device file whose commands are declared for `ble` alone: no envelope, no
# `cmd:`, one 20-byte frame on the wire. It exists so the facade's dispatch to
# a mode other than `lan` can be exercised without a radio, and it describes no
# real unit.
schema_version: 1
sku: "HTEST4"
family: "test"
name: "Frame-only device on the ble wire"

capabilities: {}

modes:
  ble:
    support: full
    capabilities: all

commands:
  ble:
    power:
      documented: false
      frame: "33 01 ${on} <pad:20> <xor>"
      args:
        on: { type: int, range: [0, 1] }
      notes: "See docs/protocol/ble.md."

    state:
      documented: false
      role: status
      frame: "aa 01 <pad:20> <xor>"
      args: {}
      notes: "See docs/protocol/ble.md."

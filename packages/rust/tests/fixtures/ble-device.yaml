# A fictional device that declares its commands for `ble` alone: no envelope,
# no `cmd:`, 20-byte frames, and `reply:` layouts to read the answers back. It
# lets the tests exercise dispatch to a mode other than `lan` without a radio.
schema_version: 1
sku: "HTEST4"
family: "test"
name: "Frame-only device on the ble wire"

capabilities:
  segments:
    count: 4

modes:
  ble:
    support: full
    capabilities: all

commands:
  ble:
    power:
      frame: "33 01 ${on} <pad:20> <xor>"
      args:
        on: { type: int, range: [0, 1] }
      notes: "See docs/protocol/ble.md."

    paint:
      role: segment_color_masked
      frame: "33 05 15 01 (${colors}:rgb)×${nb} 00 00 00 00 00 ${zones:mask8} <pad:20> <xor>"
      args:
        colors: { type: rgb_list, max_len: 1, role: colors }
        nb: { type: int, range: [1, 1] }
        zones: { type: zones, count: 6, role: zones }
      notes: "See docs/protocol/ble.md."

    colortemp:
      role: color_temp
      frame: "33 05 15 01 00 00 00 ${kelvin:16} ${white_r} ${white_g} ${white_b} ${zones:mask8} <pad:20> <xor>"
      args:
        kelvin: { type: int, range: [2000, 9000], role: color_temp }
        white_r: { type: int, range: [0, 255], role: white_red }
        white_g: { type: int, range: [0, 255], role: white_green }
        white_b: { type: int, range: [0, 255], role: white_blue }
        zones: { type: zones, count: 6, role: zones }
      notes: "See docs/protocol/ble.md."

    beat:
      role: music
      frame: "33 05 13 ${effect} ${sensitivity} ${soft} ${imposed} ${r} ${g} ${b} <pad:20> <xor>"
      args:
        effect: { type: int, range: [0, 7], role: effect }
        sensitivity: { type: int, range: [0, 99], role: sensitivity }
        soft: { type: int, range: [0, 1], role: soft }
        imposed: { type: int, range: [0, 1], role: color_mode }
        r: { type: int, range: [0, 255], role: red }
        g: { type: int, range: [0, 255], role: green }
        b: { type: int, range: [0, 255], role: blue }
      notes: "See docs/protocol/ble.md."

    state:
      role: status
      frames:
        - send: "aa 01 <pad:20> <xor>"
          reply: "aa 01 ${lit}"
        - send: "aa 04 <pad:20> <xor>"
          reply: "aa 04 ${level}"
      args:
        lit: { type: int, range: [0, 1], role: "on" }
        level: { type: int, range: [0, 100], role: brightness }
      notes: "See docs/protocol/ble.md."

    software:
      frame: "aa 21 <pad:20> <xor>"
      reply: "aa 21 ${version:ascii}"
      args:
        version: { type: string }
      notes: "See docs/protocol/ble.md."

    link:
      role: wifi_link
      frame: "33 17 ${on} <pad:20> <xor>"
      args:
        on: { type: int, range: [0, 1], role: enable }
      notes: "See docs/protocol/ble.md."

    api:
      role: wifi_api_type
      frame: "aa ab <pad:20> <xor>"
      reply: "aa ab ${kind} ${hidden}"
      args:
        kind: { type: int, range: [0, 255], role: api_type }
        hidden: { type: int, range: [0, 1], role: hide_ssid }
      notes: "See docs/protocol/ble.md."

    join:
      role: wifi_provision
      body: "${network:str8} ${password:str8} ${mode} ${tz_h} ${iot} ${tz_m}"
      chunk:
        size: 16
        header: "A1 11 00 ${count} 00 <pad:20> <xor>"
        data:   "A1 11 ${index} ${chunk:bytes} <pad:20> <xor>"
        footer: "A1 11 FF <pad:20> <xor>"
        reply:  "A1 11 ${ack}"
      args:
        ack: { type: int, range: [0, 255], role: ack_status }
        network: { type: string, max_len: 32, role: network }
        password: { type: string, max_len: 63, role: password }
        mode: { type: int, range: [0, 255], role: run_mode }
        tz_h: { type: int, range: [0, 255], role: timezone_hours }
        iot: { type: int, range: [0, 255], role: iot_version }
        tz_m: { type: int, range: [0, 59], role: timezone_minutes }
      notes: "See docs/protocol/ble.md."

    join_api:
      role: wifi_provision_with_api
      body: "${network:str8} ${password:str8} ${mode} ${tz_h} ${iot} ${tz_m} ${url:str16}"
      chunk:
        size: 16
        header: "A1 11 00 ${count} 00 <pad:20> <xor>"
        data:   "A1 11 ${index} ${chunk:bytes} <pad:20> <xor>"
        footer: "A1 11 FF <pad:20> <xor>"
        reply:  "A1 11 ${ack}"
      args:
        ack: { type: int, range: [0, 255], role: ack_status }
        network: { type: string, max_len: 32, role: network }
        password: { type: string, max_len: 63, role: password }
        mode: { type: int, range: [0, 255], role: run_mode }
        tz_h: { type: int, range: [0, 255], role: timezone_hours }
        iot: { type: int, range: [0, 255], role: iot_version }
        tz_m: { type: int, range: [0, 59], role: timezone_minutes }
        url: { type: string, max_len: 255, role: api_url }
      notes: "See docs/protocol/ble.md."

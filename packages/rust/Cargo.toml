[workspace]
resolver = "3"
members = ["crates/govee-core"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/damient/govee-toolkit"
authors = ["govee-toolkit contributors"]

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# The SDK must fail explicitly rather than abort the host application: a panic
# in a library crate is a bug, not an error path. See docs/modes.md.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

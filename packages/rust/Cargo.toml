[workspace]
resolver = "3"
members = [
  "crates/govee-core",
  "crates/govee-lan",
  "crates/govee",
  "crates/govee-sim",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/damient/govee-toolkit"
authors = ["govee-toolkit contributors"]

[workspace.dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

# Versioned as well as pathed: a path-only dependency cannot be published, and
# each package releases on its own tag (see CLAUDE.md, "Packages").
govee-core = { path = "crates/govee-core", version = "0.0.0" }
govee-lan = { path = "crates/govee-lan", version = "0.0.0" }
govee-sim = { path = "crates/govee-sim", version = "0.0.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# `pub` inside a private module still reads as public API to a contributor.
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Duplicate transitive versions are the ecosystem's to resolve, not ours:
# nothing in this workspace can act on the warning.
multiple_crate_versions = "allow"
# The SDK must fail explicitly rather than abort the host application: a panic
# in a library crate is a bug, not an error path. See docs/modes.md.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# A library writes through `tracing`, never to the process streams.
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[package]
name = "govee-toolkit-node"
description = "napi-rs binding over govee-toolkit. Not published to crates.io: it ships as the `govee-toolkit` package on npm."
# `tools/release-notes.sh` reads the number from package.json to check the tag,
# the manifest and the changelog against each other. Raise it there and here
# together.
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
homepage = "https://gvetk.com"
repository = "https://github.com/damient/govee-toolkit"
authors = ["damient"]
publish = false

# A workspace of its own: `packages/rust` is the crate the release workflow
# packages, and a member outside its directory would travel with it.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Every transport: a prebuilt binary is installed, not compiled, so the user
# picks the modes in the configuration and not with a cargo feature.
govee-toolkit = { path = "../rust", features = ["lan", "ble", "cloud"] }
# `async` pulls in the tokio runtime napi drives the futures on. `serde-json`
# turns a `serde_json::Value` into a JavaScript value.
napi = { version = "3", default-features = false, features = ["napi6", "async", "serde-json"] }
napi-derive = "3"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

# btleplug reaches BlueZ over D-Bus, and the D-Bus binding links a C library.
# `vendored` compiles that library from the sources the crate ships, so a build
# needs no D-Bus headers on the runner and no sysroot for a cross build. Cargo
# unifies the feature into the copy `btleplug` pulls in. Nothing in this crate
# calls the item.
[target.'cfg(target_os = "linux")'.dependencies]
libdbus-sys = { version = "0.2", features = ["vendored"] }

[build-dependencies]
napi-build = "2"

[lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

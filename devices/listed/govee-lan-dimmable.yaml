# Write `models:` by hand: the models for which the phone controller offers no
# solid color. `xtask lan` leaves these SKUs out of govee-lan.yaml.

schema_version: 1

listing: "govee-lan-dimmable"
source: "docs/lan-supported-devices.json"

device:
  family: "govee-lan-listed"
  include:
    - lan-documented
    - cloud-openapi

  capabilities:
    power:
    brightness:  { range: [1, 100] }

  modes:
    lan:
      support: unknown
      capabilities: [power, brightness]
      unreachable: {}
      notes: >-
        Govee lists the model as LAN-capable. Requires LAN Control enabled in
        the Govee Home app. Nobody probed this model.
    cloud:
      support: unknown
      capabilities: [power, brightness]
      unreachable: {}
      notes: >-
        The documented HTTPS API. The API answers with an error for a
        capability the model does not carry. Nobody probed this model.

  overrides:
    lan:
      color: { drop: true }
      colortemp: { drop: true }
      raw_status: { drop: true }
    cloud:
      color: { drop: true }
      colortemp: { drop: true }

models:
  - { sku: "H1811", name: "Bubble Projector Light" }
  - { sku: "H1880", name: "Tri-Zone Galaxy Light Projector" }
  - { sku: "H3860", name: "Holiday Pattern Projector Light" }
  - { sku: "H6093", name: "Star Light Projector (Aurora)" }
  - { sku: "H6094", name: "Star Light Projector (Ocean Wave)" }
  - { sku: "H6095", name: "Star Light Projector (Nebula)" }
  - { sku: "H609D", name: "Galaxy Light Projector 2 Pro" }
  - { sku: "H60B0", name: "Uplighter Floor Lamp" }
  - { sku: "H60B3", name: "Uplighter Floor Lamp" }
  - { sku: "H6630", name: "Gaming Pixel Light" }
  - { sku: "H6631", name: "Gaming Pixel Light" }
  - { sku: "H7012", name: "LED Bulb String Lights" }
  - { sku: "H7013", name: "LED Bulb String Lights" }
  - { sku: "H7070", name: "Outdoor Projector Light" }

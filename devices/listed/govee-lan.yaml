# The models on Govee's own list of LAN-capable devices. Each model resolves to
# the definition under `device:`, unless a device file of its own, or the
# `aliases:` of one, claims the SKU. A device file always wins.
#
# Nobody verified a model here. The definition carries only what Govee's
# documented LAN and HTTPS protocols give every model: power, brightness and
# color. The white temperature is absent: its range is a property of the model,
# and the firmware clamps a value outside it in silence.
#
# `models:` is generated from ../../docs/lan-supported-devices.json. Run
# `cargo run -p xtask -- lan` after a change to that file; CI fails on drift.

schema_version: 1

listing: "govee-lan"
source: "docs/lan-supported-devices.json"

device:
  family: "govee-lan-listed"
  include:
    - lan-documented
    - cloud-openapi

  capabilities:
    power:
    brightness:  { range: [1, 100] }
    color:

  modes:
    lan:
      support: unknown
      capabilities: [power, brightness, color]
      unreachable: {}
      notes: >-
        Govee lists the model as LAN-capable. Requires LAN Control enabled in
        the Govee Home app. Nobody probed this model.
    cloud:
      support: unknown
      capabilities: [power, brightness, color]
      unreachable: {}
      notes: >-
        The documented HTTPS API. The API answers with an error for a
        capability the model does not carry. Nobody probed this model.

  overrides:
    lan:
      colortemp: { drop: true }
      raw_status: { drop: true }
    cloud:
      colortemp: { drop: true }


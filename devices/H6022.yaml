# On Govee's official LAN-control list — see ../docs/lan-supported-devices.md.

schema_version: 1

sku: "H6022"
family: "rgbic-table-lamp"
name: "Table Lamp 2"
aliases: []
include:
  - lan-documented
  - lan-razer
  - ble-core
  - ble-reads
  - ble-color
  - ble-music
  - ble-segments
  - ble-version-06
  - ble-wifi-provision
  - cloud-openapi
  - cloud-segments
  - cloud-music

candidate_aliases: []

capabilities:
  power:
  brightness:  { range: [0, 100] }   # 0 renders the minimum, see verified below
  color:
  colortemp:   { range_kelvin: [2700, 6500] }   # measured, see verified below
  music:       # the phone controller offers it, over the lamp's own microphone
  segment_brightness:   # ble only, see the mode table
  segments:
    count: 132            # the phone controller paints a grid of 12 by 11
    native_pixels: 132    # one zone is one LED, see verified below
    groups: 15            # the width the `ble` mask and the `cloud` zone array
                          # reach, so a host has a coarse view to paint

modes:
  lan:
    support: capped
    capabilities: [power, brightness, color, colortemp, segments]
    unreachable:
      segment_brightness: transport
      music: transport
    notes: >-
      Requires LAN Control enabled in the Govee Home app. The four documented
      commands answer and read back through `devStatus`, and the segment
      channel of docs/protocol/lan.md 2.3 paints. Brightness is global here:
      the segment channel carries color only. It carries no music command: the
      lamp renders no music over lan, and a host that streams computed colors
      over the segment channel is not this capability. See
      docs/protocol/lan.md 2.4.
  ble:
    support: full
    capabilities: [power, brightness, color, colortemp, segments, segment_brightness, music]
    unreachable: {}
    notes: >-
      Reaches every capability without the lamp being on the network, over an
      encoded link. The unit sets the encoding flag of docs/protocol/ble.md
      1.5, so the transport runs the handshake of 9 before any command. Colour
      and the white temperature share sub-mode 13, one colour over the whole
      lamp. Segments are narrower here than over lan: zones are addressed
      through a mask 15 bits wide, against the 132 LEDs the lan raw channel
      reaches. Music runs off the lamp's own microphone, at sub-mode 19, which
      lan carries no command for. Wi-Fi provisioning works from here, through
      `provision_wifi()`. One connection at a time: a connected lamp stops
      advertising. See docs/protocol/ble.md.
  cloud:
    support: capped
    capabilities: [power, brightness, color, colortemp, segments, music]
    unreachable:
      segment_brightness: transport
    notes: >-
      The documented HTTPS API, over a Govee account and internet. It reaches
      the segment channel in color: 15 zones, the width the `ble` mask has,
      against the 132 LEDs the lan raw channel reaches. It carries no per-zone
      brightness: the account list declares no such instance for this device,
      and the control endpoint refuses it. Music runs off the lamp's own
      microphone, over four effects against the eight `ble` renders. This mode
      refuses a value outside a declared range rather than clamp it, which the
      other two modes do in silence. It opens no segment stream: it takes one
      request every few seconds. See docs/protocol/cloud.md 5 and 6.

commands:
  # Every frame here is 20 bytes: proType, commandType, payload, then a XOR of
  # the 19 bytes before it. See docs/protocol/ble.md 1.2.
  ble:
    colortemp:
      role: color_temp
      frame: "33 05 0D 00 00 00 ${kelvin:16} 00 00 00 <pad:20> <xor>"
      args:
        kelvin: { type: int, range: colortemp.range_kelvin, role: color_temp }
      notes: >-
        Sub-mode 13 with the colour triplet at zero. The firmware renders the
        temperature itself, so the frame carries no white triplet and zeroes
        that field: a frame sent with the field at zero reads back with the
        rendering the firmware computed. It clamps a value outside the range
        above in silence. See docs/protocol/ble.md 2.3.

overrides:
  lan:
    brightness:
      notes: >-
        Percent. The firmware clamps a value above 100 to 100 in silence, and
        it stores 0. See `verified:` for what 0 renders.

    color:
      notes_append: >-
        One color over every ring of the cylinder. See docs/protocol/lan.md 1,
        "Documented commands".

    colortemp:
      notes_append: >-
        It clamps a value outside the range above in silence. See
        docs/protocol/lan.md 1, "Documented commands".

    segment_color:
      args:
        nb_seg: { range: [1, 132] }
        colors: { max_len: 132 }
      notes_append: >-
        The ceiling of 132 zones is this unit's LED count, not the protocol's
        limit: 133 zones and above are dropped in silence. See `measurements`
        and docs/protocol/lan.md 2.3.

  ble:
    read_version_06:
      notes_append: >-
        A third version, 1.00.14 on this unit, against the 1.04.01 and 1.03.08
        the two reads above answer. TODO: nothing established which module each
        of the three names. See docs/protocol/ble.md 3.

    brightness:
      notes: >-
        Percent, and global: it scales the whole lamp. Per-zone brightness is
        `segment_brightness` below. See docs/protocol/ble.md 2.2.

    color:
      notes: >-
        Sub-mode 13, the one-colour layout of docs/protocol/ble.md 2.3: the
        triplet, then a kelvin value and a white triplet left at zero. One
        colour over every ring of the cylinder. To paint zones, use
        `segment_color`.

    read_mode:
      notes_append: >-
        It reports the fields of a sub-mode 13 frame, so `color` and
        `colortemp` read back here. Under sub-mode 21 the payload is zero, and
        under sub-mode 19 it never echoes what was written — see `verified:`.
        See docs/protocol/ble.md 3.

    read_segment_count:
      notes_append: >-
        Answers 15 on this unit, not the 132 LEDs. See docs/protocol/ble.md 3.

    read_ic_count:
      notes_append: >-
        Answers 132 on this unit. See docs/protocol/ble.md 3.

    read_hardware_version:
      notes_append: >-
        1.04.01 on this unit. See docs/protocol/ble.md 3.

    read_software_version:
      notes_append: >-
        1.03.08 on this unit. See docs/protocol/ble.md 3.

    segment_brightness_masked:
      notes: >-
        Brightness of the zones the mask names, leaving the rest alone. Trap:
        it applies only while the lamp is in sub-mode 21. Against sub-mode 13,
        which `color` and `colortemp` set, it changes nothing. Send
        `segment_color` first. See docs/protocol/ble.md 2.4.

    segment_brightness:
      notes_append: >-
        The sub-mode 21 trap of `segment_brightness_masked` applies here as
        well. See docs/protocol/ble.md 2.5.

    gradient:
      notes: >-
        Whether the firmware interpolates between zones. The same setting the
        lan segment channel carries as its `gradient` argument. TODO: nothing
        established what this unit does with the byte. The diffuser blurs the
        edge between two zones, so the eye reads no difference either way —
        see `verified:`.

    music:
      notes: >-
        Sub-mode 19. The lamp listens on its own microphone. `effect` selects
        the rendering: 0 to 7 each render one. A value above 7 renders one
        same effect rather than nothing, so a rendering is not evidence that
        the identifier names an effect of its own — see `verified:`.
        `color_mode` 0 leaves the colours to the firmware and 1 imposes the
        triplet. TODO: nothing established what this unit does with `soft` or
        with `sensitivity`. No read reports what was written: `read_mode`
        answers sub-mode 19 with a payload that never echoes the frame. See
        docs/protocol/ble.md 2.7.

  cloud:
    segment_color:
      notes_append: >-
        It paints one color over the zones the array names, and leaves the
        rest alone. The account list bounds the array at 15 entries and a zone
        index at 14, which is the width of the `ble` mask and not the 132
        LEDs. See docs/protocol/cloud.md 5.

    power:
      notes: >-
        Trap: the lamp comes back at the brightness it stored, which is 1
        after an `off` at 1. A lamp that lit at the minimum reads as a lamp
        that did not light. See `verified:`.

    brightness:
      notes: >-
        Percent. The API refuses 0 rather than clamp it, with 400 `Parameter
        value out of range`. See `verified:`.

    color:
      notes_append: >-
        One color over every ring of the cylinder.

    colortemp:
      notes: >-
        The range the account list declares for this device. The API refuses a
        value outside it rather than clamp: `lan` and `ble` clamp in silence,
        this mode answers 400. Under a temperature the state reports the color
        as 0. See `verified:`.

    status:
      notes_append: >-
        This mode reads back no segment state and no music state: both
        instances answer an empty value. See `verified:`.

measurements:
  segment_max_zones: 132    # the highest nbSeg this firmware renders. 133 and
                            # above draw nothing and report nothing
  segment_grid: [12, 11]    # 12 LEDs around one ring, 11 rings up the cylinder
  zone_0_end: "base"        # zone 0 at the base, the last zone at the top
  segment_chain: "snake"    # the chain folds back at each ring: zone 12 is the
                            # LED above zone 11, not the one above zone 0
  frame_rate:
    # Measured on the razer segment channel, at the full 132 zones. Watched on
    # the unit: the round trip cannot answer here, because the lamp answers no
    # `devStatus` while the channel is armed. See `verified:`.
    lan:
      - { zones: 132, payload_bytes: 398, clean_hz: 100, breaks_at_hz: 150 }
  ble:
    addressable_zones: 15   # what AA 0F answers, against the 132 LEDs. One
                            # zone is 8.8 LEDs, so no zone covers a whole ring

verified:
  by: "damient"
  firmware: "1.03.08"
  date: "2026-09-22"
  notes: >-
    lan mode exercised over UDP on one unit, through the Rust CLI. The unit
    answers the multicast discovery. Power, brightness, color and the white
    temperature were written and read back through `devStatus`.

    Brightness is percent and the firmware clamps: 101, 200 and 255 each read
    back as 100. It stores 0, and 0 renders the minimum rather than turning the
    lamp off — `devStatus` keeps reporting `onOff` 1 through it, so only
    `power` turns the lamp off.

    The white range was measured by anchoring the lamp at 4000 K and then
    asking for another temperature, so that a clamp reads as a move to the
    bound and a refusal reads as the anchor. 2000, 1900 and 1000 K each read
    back as 2700, and 9000, 9500 and 12000 K each read back as 6500. The bounds
    are 2700 and 6500 K, and the firmware clamps outside them in silence.
    Under a temperature the `color` field reads `00 00 00`.

    Color and the white temperature both render over every ring of the
    cylinder.

    The segment channel paints. Zone 0 is at the base and the index climbs to
    the top, but the chain wraps around the cylinder: one ring carries several
    addressable positions, so a zone is a point on the chain and not a ring. A
    pattern of alternating colors reads as scattered points rather than as
    stacked bands.

    The zone ceiling is 132. Every count up to 132 paints. 133, 134, 135, 140,
    160, 200 and 255 each draw nothing and report nothing, and the display
    stays at what the last accepted frame left. The ceiling is the LED count:
    the phone controller paints a grid of 12 by 11, which is 132, and the
    firmware drops a frame that names more zones than the unit has LEDs.

    One zone is one LED. Zone 124 and zone 131 light two different LEDs, and
    each index from 124 to 131 lights one. The grid is 12 LEDs around one ring
    and 11 rings up the cylinder.

    The chain folds back at each ring: zone 12 is the LED above zone 11. One
    column of the grid reads as a straight vertical line where every second
    ring is reversed, and as a zigzag where every ring carries the same
    direction. A frame that paints a grid must reverse every second ring.

    Trap: the diffuser blurs the edge between two zones, so this unit reports
    nothing about the `gradient` byte to the eye. Every frame above was sent
    with `gradient` 0.

    A `colortemp` sent while the segment channel is armed applies the white
    and ends the channel: the frames that follow paint nothing. A disarm after
    it keeps the white. Trap: the arm that follows a white shows the lamp dark
    until the first frame. Exercised twice through the CLI, judged by eye.

    The 15 groups of `segments.groups` paint over lan, through the DMX bridge
    at `personality: segment`. Zones 0 to 2 lit red at the base and the rest
    blue, the orientation `ble` and `cloud` render. Alternating red and green
    over the 15 zones read as 15 blocks: one group is 8.8 LEDs against the 12
    of one ring, so a group reads as a band although the chain snakes. The
    bridge paints each group over its own LEDs, so this says nothing about what
    the firmware renders for a frame of 15 zones.

    The lamp keeps the lan raw segment channel through a `turn` and through a
    `brightness` sent while the channel is armed: it kept animating through
    both, and the brightness applied. See docs/protocol/lan.md 2.3.

    The segment channel sustains 100 Hz at 132 zones, which is a 398-byte
    payload. 150 Hz stutters. The rates between the two were not watched, and
    no other zone count was measured.

    Trap: the lamp answers no `devStatus` while the segment channel is armed.
    It stays silent from the arming frame to the disarm, and it does so with
    no frame sent at all, so the silence follows the arming and not the load.
    It answers again on the first request after the disarm. Fire-and-verify
    therefore reports nothing while a stream runs, and the throughput
    measurement of docs/protocol/lan.md 2.7 cannot be taken on this unit.

    Trap: the lamp drops a command that arrives directly behind two others.
    Three commands sent back to back over lan lose the third in 3 attempts of
    4, and the lamp holds the value the lost one meant to replace. A wait of
    1 ms between two commands lost none over 4 attempts, and so did 2, 3, 5,
    10, 20, 50 and 100 ms. Two commands back to back lost none over 4
    attempts. See docs/protocol/lan.md 1, "Consecutive commands".

    The lamp has a microphone and the phone controller offers a music mode.
    lan carries no music command, so that is a ble session, below.

    ble mode reaches every capability, over the encoded link of
    docs/protocol/ble.md 9. The unit advertises as `Govee_H6022_646E`, the
    underscore grammar of 1.3, and the tail carries the last two bytes of the
    identity lan reports. Its advertisement field reads `43 88 ec 00 02 02`:
    the encoding flag set, layout version 3, pactType 2, pactCode 2. Every
    command below went through the Rust CLI, which sends exactly the frames
    this file declares.

    The four version reads answer four values that all differ: `AA 20` 1.04.01,
    `AA 21` 1.03.08, `AA 06` 1.00.14 and `AA 07 03` 3.05.01. The H6008 answers
    two values for the same four reads, so no read here is the same read as
    another, and nothing establishes which module each one names. `firmware:`
    above carries the `AA 21` one.

    Power and brightness answer and read back over `AA 01` and `AA 04`.
    Brightness is percent and it scales the whole lamp. Brightness 0 was NOT
    walked over ble; what it renders is the lan measurement above.

    Colour and the white temperature share sub-mode 13, one colour over every
    ring. The firmware renders the temperature itself: a frame sent with the
    white triplet at `00 00 00` reads back at `read_mode` with the triplet the
    firmware computed, 2700 K as `ff 8d 0b` and 6500 K as `ff f1 e7`. The white
    range was measured by anchoring the lamp at 4000 K and then asking for
    another temperature. 2000 and 1000 K each read back as 2700, and 9000 and
    12000 K each read back as 6500, with the anchor holding between each step.
    The bounds are the lan ones, 2700 and 6500 K, and the firmware clamps
    outside them in silence.

    Segments paint through a mask 15 bits wide, at sub-mode 21. The mask is
    read: against a lamp painted blue, zones 0 to 2 lit red at the base and
    zones 8 to 14 lit green at the top, each leaving the rest blue. The 15
    zones divide the 132 LEDs, so one zone is 8.8 LEDs and a zone boundary
    falls inside a ring rather than between two rings — the edge of a painted
    block stops part way along a ring. A zone index above 14 is refused here
    rather than sent.

    Per-zone brightness works, both by mask and as a list of fifteen. Trap:
    only while the lamp is in sub-mode 21. The first attempt ran against a lamp
    painted by `color`, which is sub-mode 13, and changed nothing at all; the
    same frames dimmed the named zones once `segment_color` had painted the
    lamp. A list of fifteen set the low seven zones to 10 and the high eight to
    100, and then the reverse, and the lamp followed both ways.

    Music renders from the lamp's own microphone. `color_mode` 1 imposes the
    triplet: the lamp answered sound over an imposed blue. Effects 0 to 7 each
    render, and the lowest few look alike to the eye. Trap: 8, 15 and 255 each
    render one same effect rather than nothing, so a rendering is no evidence
    that an identifier names an effect of its own. The H61A0 renders nothing
    for those values, so this is not a property of the frame. `soft` was NOT
    established: 0 and 1 render the same on effect 4. `sensitivity` was NOT
    probed. `read_mode` answers sub-mode 19 with `65 64 00 00 00 ff 00 00`
    whatever the frame carried, so it reports nothing a caller wrote.

    Gradient was NOT established. `33 A3` draws no acknowledgement, and the
    diffuser blurs the edge between two zones, so alternating red and blue
    bands looked the same under both settings. The lan session reported the
    same about its own `gradient` byte.

    Wi-Fi provisioning: `AA AB` answers type 2 and no hidden-network flag, so
    the transfer carries the endpoint block. The lamp accepted the transfer and
    acknowledged it. Trap: it was already on the network the credentials named,
    so joining a network it was not on is NOT established.

    cloud mode reaches every capability but per-zone brightness. The account
    addresses the lamp by a MAC, whose last two bytes are the ones the ble
    advertisement carries. Every command below went through the Rust CLI, and
    every refusal quoted is the API's own answer.

    This mode refuses rather than clamps, which is the opposite of what the
    other two do. Brightness 0 answers 400 `Parameter value out of range`, and
    so do 2000 K and 9000 K, with the lamp holding the 4000 K anchor through
    both. lan and ble clamp each of those in silence.

    Power, brightness and the two color commands apply and read back through
    the state endpoint. Brightness 100, 50 and 1 each read back as written.
    Trap: `power` on brings the lamp back at the brightness it stored, so a
    lamp that was turned off at 1 lights at the minimum and reads as a lamp
    that did not light.

    The white range is 2700 to 6500 K, the bounds the account list declares and
    the bounds lan and ble measured. Under a temperature the state reports the
    color as 0, and under a color it reports the temperature as 0.

    Segments paint over 15 zones, the width the ble mask has. The zone array is
    read: against a lamp painted blue, zones 0 to 2 lit red at the base and
    zones 12 to 14 lit green at the top, each leaving the rest blue. Zone 0 is
    at the base, the ble orientation.

    Music renders from the lamp's own microphone. Effects 3, 4, 5 and 6 each
    answer sound. Those four are the whole enum the account list declares, and
    the API holds it: `musicMode` 1 and 19 each answer 400 `Parameter value out
    of range`. ble renders something for a value outside its own range, so this
    is a property of this mode and not of the lamp. `autoColor` and `rgb` were
    NOT probed. `sensitivity` was NOT probed: every frame above carried 50.

    Per-zone brightness and the gradient toggle are both out of reach here.
    `segmentedBrightness` and `gradientToggle` each answer 400 `devices not
    support this instance`. That refusal is the evidence, and the account list
    declares neither instance for this device. The H61A0 declares both.

    This mode reads back nothing it paints: `segmentedColorRgb` and `musicMode`
    each answer an empty value at the state endpoint, whatever the lamp is
    rendering. The answer to the control request is the only verification.

    The state answer also carries an `online` flag, which the SDK models
    nothing of.

# H61A0 — 3m RGBIC LED Neon Rope Lights.
# On Govee's official LAN-control list (see ../docs/lan-supported-devices.md).
# Verified over `lan`, including the undocumented segment channel, and over
# `ble` apart from Wi-Fi provisioning — see `verified:` at the bottom.

schema_version: 1

sku: "H61A0"
family: "rgbic-neon-rope"
name: "3m RGBIC LED Neon Rope Lights"
aliases: []
candidate_aliases:      # same product in other lengths — NOT verified, do not
  - H61A1               # assume identical behavior: segment count and native
  - H61A2               # resolution both depend on length. 2 m, 5 m, 4 m and
  - H61A3               # 10 m respectively — see ../docs/lan-supported-devices.md.
  - H61A5               # The outdoor rope, H61A8 and H61A9, is another product.

capabilities:
  power:
  brightness:  { range: [1, 100] }
  color:
  colortemp:   { range_kelvin: [2000, 9000] }
  scenes:
  segment_brightness:
  segments:
    count: 10             # zones the Govee app exposes
    native_pixels: 42     # measured on a 3 m unit — see measurements below

modes:
  lan:
    support: partial
    capabilities: [power, brightness, color, colortemp, segments]
    unreachable:
      scenes: transport
      segment_brightness: transport
    notes: >-
      Requires LAN Control enabled in the Govee Home app. Reaches the segment
      channel, including beyond the 10 zones the app exposes. Brightness is
      global here: the segment channel carries color only. See
      docs/protocol/lan.md 2.5.
  ble:
    support: partial
    capabilities: [power, brightness, color, colortemp, segments, segment_brightness]
    unreachable:
      scenes: unimplemented
    notes: >-
      Reaches power, brightness, colour, colour temperature and both per-zone
      channels without the device being on the network. Segments are narrower
      here than over lan: zones are addressed through a mask 15 bits wide,
      against the 42 individually addressable ICs the lan raw channel reaches,
      and bits past the fifteenth reach nothing. Scenes travel over a second
      chunked channel whose header was not worked out. Wi-Fi provisioning is
      declared here but has never been sent to a device. One connection at a
      time: a connected device stops advertising. See docs/protocol/ble.md.
  cloud:
    support: partial
    capabilities: [power, brightness, color, colortemp, scenes, segment_brightness]
    unreachable:
      segments: transport
    notes: >-
      Internal scenes and per-segment brightness travel over MQTT to AWS IoT,
      and the per-segment color channel does not. Requires a Govee account and
      internet. See docs/protocol/cloud.md.

commands:
  lan:
    power:
      cmd: "turn"
      documented: true
      payload: { value: "${on}" }
      args:
        on: { type: int, range: [0, 1] }
      capture: ""         # TODO

    brightness:
      cmd: "brightness"
      documented: true
      payload: { value: "${level}" }
      args:
        level: { type: int, range: [1, 100] }   # 0 is clamped to 1, it does not turn off
      capture: ""         # TODO

    color:
      cmd: "colorwc"
      documented: true
      payload:
        color: { r: "${r}", g: "${g}", b: "${b}" }
        colorTemInKelvin: 0
      args:
        r: { type: int, range: [0, 255] }
        g: { type: int, range: [0, 255] }
        b: { type: int, range: [0, 255] }
      capture: ""         # TODO

    colortemp:
      cmd: "colorwc"
      documented: true
      payload:
        color: { r: 0, g: 0, b: 0 }
        colorTemInKelvin: "${kelvin}"
      args:
        kelvin: { type: int, range: [2000, 9000] }
      capture: ""         # TODO

    status:
      cmd: "devStatus"
      documented: true
      role: status        # the entry fire-and-verify issues on its own
      payload: {}
      args: {}
      capture: ""         # TODO

    raw_status:
      cmd: "status"
      documented: false
      payload: {}
      args: {}
      notes: >-
        Returns onOff, brightness and a frozen base64 `pt` capability
        descriptor. Read-only in practice. See docs/protocol/lan.md 2.2.
      capture: ""         # TODO

    dreamview_enable:
      cmd: "razer"
      documented: false
      role: segment_enable
      frame: "BB <len:16> <op:B1> ${on} <xor>"
      payload: { pt: "${frame}" }
      args:
        on: { type: int, range: [0, 1], role: enable }
      notes: >-
        Arms the raw segment channel. Send turn(1) first. See
        docs/protocol/lan.md 2.3.
      capture: ""         # TODO

    segment_color:
      cmd: "razer"
      documented: false
      role: segment_color
      frame: "BB <len:16> <op:B0> ${gradient} ${nb_seg} (${colors}:rgb)×${nb_seg} <xor>"
      payload: { pt: "${frame}" }
      args:
        gradient: { type: int, range: [0, 1], role: gradient }   # 0 = hard zones, 1 = interpolated + wraps
        nb_seg: { type: int, range: [1, 255] }                   # derived from colors when omitted
        colors: { type: rgb_list, max_len: 255, role: colors }   # one triple per zone
      notes: >-
        len counts the payload only, 16-bit, header and checksum excluded. An
        inconsistent length is dropped in silence. See docs/protocol/lan.md 2.3.
      capture: ""         # TODO

  # Every frame here is exactly 20 bytes: proType, commandType, payload, and a
  # XOR of the nineteen bytes before it. Hence the `<pad:20> <xor>` every layout
  # ends on. See docs/protocol/ble.md 1.2.
  #
  # No ble capture has been redacted and committed yet, so every `capture:`
  # below is empty. TODO: capture and redact one per command.
  ble:
    power:
      documented: false
      frame: "33 01 ${on} <pad:20> <xor>"
      args:
        on: { type: int, range: [0, 1] }
      notes: "See docs/protocol/ble.md 2.1."
      capture: ""         # TODO

    brightness:
      documented: false
      frame: "33 04 ${level} <pad:20> <xor>"
      args:
        level: { type: int, range: [1, 100] }
      notes: >-
        Percent on this unit, not 0..255. See docs/protocol/ble.md 2.2.
      capture: ""         # TODO

    color:
      documented: false
      role: segment_color_masked
      frame: "33 05 15 01 (${colors}:rgb)×${nb} 00 00 00 00 00 ${zones:mask16} <pad:20> <xor>"
      args:
        colors: { type: rgb_list, max_len: 1, role: colors }
        nb: { type: int, range: [1, 1] }        # derived from colors when omitted
        zones: { type: zones, count: 15, role: zones }
      notes: >-
        Paints one colour over the zones the mask names. The kelvin and white
        fields stay zero: colour and white are mutually exclusive, and a
        non-zero kelvin is what turns this frame into the colortemp one. A
        saturated mask looks exactly like an ignored mask, so painting every
        zone proves nothing about the mask being read — paint a subset, as the
        `verified:` block below did. See docs/protocol/ble.md 2.3.
      capture: ""         # TODO

    colortemp:
      documented: false
      frame: "33 05 15 01 00 00 00 ${kelvin:16} ${white_r} ${white_g} ${white_b} ${zones:mask16} <pad:20> <xor>"
      args:
        kelvin: { type: int, range: [2000, 9000] }
        white_r: { type: int, range: [0, 255] }
        white_g: { type: int, range: [0, 255] }
        white_b: { type: int, range: [0, 255] }
        zones: { type: zones, count: 15 }
      notes: >-
        The firmware does not render the temperature: the caller ships the
        kelvin value and its RGB rendering in the same frame, and one carrying
        only the kelvin value leaves the zones dark. See
        docs/protocol/ble.md 2.3.
      capture: ""         # TODO

    segment_brightness_masked:
      documented: false
      frame: "33 05 15 02 ${level} ${zones:mask16} <pad:20> <xor>"
      args:
        level: { type: int, range: [1, 100] }
        zones: { type: zones, count: 15 }
      notes: >-
        Brightness of the zones the mask names, leaving the rest alone. See
        docs/protocol/ble.md 2.4.
      capture: ""         # TODO

    segment_brightness:
      documented: false
      frame: "33 05 15 03 ${levels:bytes} <pad:20> <xor>"
      args:
        levels: { type: bytes, max_len: 15 }
      notes: >-
        Every zone at once, one byte each in zone order, and there is no mask:
        pass all fifteen. A shorter list is padded with zeros, which sets the
        zones it does not cover to zero rather than leaving them alone. The
        bytes are not interpreted here, so nothing checks each one against the
        1..100 the firmware takes: a 0 or a 200 in the list reaches the device
        and the firmware clamps it in silence. This command is the one place in
        this file where the no-clamp guarantee does not hold. TODO: give the
        `bytes` type a per-element range so each level is checked, then drop
        this paragraph and add the error vector it makes writable.
        See docs/protocol/ble.md 2.5.
      capture: ""         # TODO

    gradient:
      documented: false
      role: segment_gradient
      frame: "33 A3 ${on} <pad:20> <xor>"
      args:
        on: { type: int, range: [0, 1], role: gradient }
      notes: >-
        Whether the firmware interpolates between zones, wrapping from the last
        back to the first; 0 gives hard-edged zones. The same user setting as
        the `gradient` argument of the lan segment channel, which has no room
        for it here and so carries it in a frame of its own. It is not a fade
        over time: alternating two colours looks the same either way, and what
        changes is the boundary between two zones painted differently. See
        docs/protocol/ble.md 2.6.
      capture: ""         # TODO

    status:
      documented: false
      role: status        # the entry fire-and-verify issues on its own
      frames:
        - send:  "AA 01 <pad:20> <xor>"
          reply: "AA 01 ${on}"
        - send:  "AA 04 <pad:20> <xor>"
          reply: "AA 04 ${level}"
      args:
        on: { type: int, range: [0, 1], role: "on" }
        level: { type: int, range: [1, 100], role: brightness }
      notes: >-
        Two reads: no single frame reports both. See docs/protocol/ble.md 3.
      capture: ""         # TODO

    read_segment_count:
      documented: false
      frame: "AA 0F <pad:20> <xor>"
      reply: "AA 0F ${segments}"
      args:
        segments: { type: int, range: [0, 255] }
      notes: >-
        Answers 15 on this unit, which is the width of the zone mask, not the
        10 zones the app exposes nor the 42 ICs. See docs/protocol/ble.md 3.
      capture: ""         # TODO

    read_ic_count:
      documented: false
      frame: "AA 40 <pad:20> <xor>"
      reply: "AA 40 ${pixels:16}"
      args:
        pixels: { type: int, range: [0, 65535] }
      notes: >-
        Answers 42 on this unit, matching the native resolution measured over
        lan. See docs/protocol/ble.md 3.
      capture: ""         # TODO

    read_wifi_mac:
      documented: false
      frame: "AA 14 <pad:20> <xor>"
      reply: "AA 14 ${mac:bytes:6}"
      args:
        mac: { type: bytes, max_len: 6 }
      notes: >-
        The Wi-Fi MAC, which is how the rest of this project identifies a
        device — an advertisement carries the Bluetooth address instead. See
        docs/protocol/ble.md 3.
      capture: ""         # TODO

    read_hardware_version:
      documented: false
      frame: "AA 20 <pad:20> <xor>"
      reply: "AA 20 ${version:ascii:17}"
      args:
        version: { type: string, max_len: 17 }
      notes: >-
        ASCII, zero-padded out to the checksum; 1.02.00 on this unit. The
        length is what stops the field before that byte. See
        docs/protocol/ble.md 3.
      capture: ""         # TODO

    read_software_version:
      documented: false
      frame: "AA 21 <pad:20> <xor>"
      reply: "AA 21 ${version:ascii:17}"
      args:
        version: { type: string, max_len: 17 }
      notes: >-
        ASCII, zero-padded out to the checksum; 2.06.02 on this unit. The
        length is what stops the field before that byte. See
        docs/protocol/ble.md 3.
      capture: ""         # TODO

    read_dynamic_api:
      documented: false
      frame: "AA AB <pad:20> <xor>"
      reply: "AA AB ${api_type}"
      args:
        api_type: { type: int, range: [0, 255] }
      notes: >-
        Which API endpoint provisioning should hand the device. Answers 2 on
        this unit. See docs/protocol/ble.md 3 and 4.
      capture: ""         # TODO

    read_zone_state:
      documented: false
      frame: "AA A5 ${group} <pad:20> <xor>"
      args:
        group: { type: int, range: [1, 5] }
      notes: >-
        Brightness and colour for three zones, groups 1-based. Declares no
        `reply:` for two reasons: the byte layout of the answer was not
        established, and what it reports is the stored colour sub-mode rather
        than what is lit, so it is not a way to read back what `color` painted.
        See docs/protocol/ble.md 3.
      capture: ""         # TODO

    # Never sent to a device. The layout below was read out of the other
    # direction only, and the golden vectors behind it pin this encoder, not
    # the firmware. See docs/protocol/ble.md 4.
    wifi_provision:
      documented: false
      body: "${network:str8} ${password:str8} ${run_mode} ${timezone_hours} ${iot_version} ${timezone_minutes}"
      chunk:
        size: 16
        header: "A1 11 00 ${count} 00 <pad:20> <xor>"
        data:   "A1 11 ${index} ${chunk:bytes} <pad:20> <xor>"
        footer: "A1 11 FF <pad:20> <xor>"
      args:
        network: { type: string, max_len: 32 }
        password: { type: string, max_len: 63 }
        run_mode: { type: int, range: [0, 255] }          # 0 in production
        timezone_hours: { type: int, range: [0, 255] }    # hours and minutes are
        timezone_minutes: { type: int, range: [0, 59] }   # separate bytes
        iot_version: { type: int, range: [0, 255] }       # 0 in production
      notes: >-
        Plaintext: no encryption, no key exchange, no session token, so anything
        in radio range during provisioning sees the password. An empty password
        is the single byte 0x00. What a negative timezone offset looks like was
        not observed. NEVER SENT TO A DEVICE — see docs/protocol/ble.md 4.
      capture: ""         # never captured: nothing was ever sent

    wifi_provision_with_api:
      documented: false
      body: "${network:str8} ${password:str8} ${run_mode} ${timezone_hours} ${iot_version} ${timezone_minutes} ${api_url:str16}"
      chunk:
        size: 16
        header: "A1 11 00 ${count} 00 <pad:20> <xor>"
        data:   "A1 11 ${index} ${chunk:bytes} <pad:20> <xor>"
        footer: "A1 11 FF <pad:20> <xor>"
      args:
        network: { type: string, max_len: 32 }
        password: { type: string, max_len: 63 }
        run_mode: { type: int, range: [0, 255] }
        timezone_hours: { type: int, range: [0, 255] }
        timezone_minutes: { type: int, range: [0, 59] }
        iot_version: { type: int, range: [0, 255] }
        api_url: { type: string, max_len: 255 }
      notes: >-
        The same transfer with the trailing API block, which is sent when
        `read_dynamic_api` answers with a type. There is no optional field in
        this language, so the block is a separate entry rather than an argument
        left out. NEVER SENT TO A DEVICE — see docs/protocol/ble.md 4.
      capture: ""         # never captured: nothing was ever sent

  cloud: {}               # TODO

# Measured on one physical unit. Anything here depends on that unit's LENGTH as
# much as on the SKU — see docs/protocol/lan.md 2.3 and 2.7.
measurements:
  unit_length_m: 3
  native_pixels: 42         # one addressable LED every ~7 cm
  segment_count_app: 10
  resolution_changepoints: [1, 2, 3, 4, 5, 6, 7, 9, 11, 14, 21, 42]

  latency_idle_ms:
    median: 16
    p95: 28
    max: 39
    loss: "0/30 requests"

  # Taken on the same unit, over the 20-byte GATT frame — see
  # docs/protocol/ble.md 5.
  ble:
    read_round_trip_ms: 63          # against 16 ms over lan
    sustained_writes_hz: 130        # spread over seconds
    write_budget_hz: 100            # what the transport paces itself to
    burst_frames_before_stall: 100  # roughly, in one burst
    burst_recovery_s: 20            # unresponsive for about this long after one
    addressable_zones: 15           # by mask, against the 42 ICs above

  frame_rate:
    # Sustainable frame rate for the razer segment channel, by zone count.
    lan:
      - { zones: 20,  payload_bytes: 62,  clean_hz: 40, breaks_at_hz: 45 }
      - { zones: 60,  payload_bytes: 182, clean_hz: 25, breaks_at_hz: 30 }
      - { zones: 120, payload_bytes: 362, clean_hz: 20, breaks_at_hz: 25 }
    # No ble rows. A ble frame is always 20 bytes and one frame paints one
    # colour, so dividing the write budget above by the zone count gives a
    # figure — but that is arithmetic, not a stutter test on the rope, and a
    # caller cannot tell a derived row from a measured one. TODO: run the
    # stutter test over ble and record what the strip renders cleanly. Until
    # then a stream over ble falls back to the configured rate.

verified:
  by: "damient"
  firmware: "2.06.02"
  date: "2026-09-06"
  notes: >-
    lan mode fully exercised, including the undocumented razer segment channel
    at native resolution. ble mode exercised over GATT on the same unit, against
    soft version 2.06.02 and hard version 1.02.00: every 0x33 write and every
    0xAA read in the table above was sent to the device and its effect or its
    answer observed, this time through the Rust transport rather than by hand.
    The zone mask is read by the firmware and not ignored: painting zones 0-2
    over a rope already painted left the rest alone. `gradient` was told apart
    from a fade over time the same way — the boundary between two differently
    painted zones is what it changes. Wi-Fi provisioning over 0xA1 was NOT
    exercised: its layout was read out of the other direction only, and no frame
    of it has ever been sent to a device — its golden vectors pin this encoder,
    not the firmware. Scenes were not worked out. No ble capture has been
    redacted and committed yet, so every `capture:` in the ble table is empty.
    See measurements above.

# govee-toolkit — device definition schema.
#
# Reference schema, not a device: see README.md for the how-to and any device
# file next to it for a real entry.

schema_version: 1

sku: ""                 # required — e.g. "H61A0"
family: ""              # required — e.g. "rgbic-strip"
name: ""                # required — human-readable model name
aliases: []             # optional — other SKUs VERIFIED to share this definition
candidate_aliases: []   # optional — SKUs that look like the same product but
                        # have not been verified; never merge them into aliases
                        # on family resemblance alone

capabilities:           # what the hardware can do, regardless of mode
  power: false
  brightness: false
  color: false
  colortemp: false
  scenes: false
  segments: false
  sensors: false

  brightness_range: [1, 100]
  colortemp_range_kelvin: [2000, 9000]
  segment_count: 0      # zones the Govee app exposes
  native_pixels: 0      # optional — real addressable LEDs, if measured. Depends
                        # on the LENGTH of the unit, not only the SKU: record a
                        # measured value or leave it at 0, never extrapolate.

modes:
  # Which modes this hardware SUPPORTS. This is fact, not preference: the user
  # picks which supported modes to enable, per device, in their own runtime
  # config. See ../docs/modes.md.
  #
  # support: full | partial | none | unknown
  #   none    — established that the hardware cannot do this mode
  #   unknown — nobody probed it. The default, and the right answer until
  #             somebody does: a failed probe and an unimplemented feature look
  #             identical from outside
  # capabilities: subset of the capability keys above reachable in this mode;
  #               "all" means every capability the hardware has.
  lan:
    support: unknown
    capabilities: []
    notes: ""
  ble:
    support: unknown
    capabilities: []
    notes: ""
  cloud:
    support: unknown
    capabilities: []
    notes: ""

commands:
  # One table per mode. A command absent from a mode is not reachable in
  # that mode — the SDK must fail explicitly rather than approximate it.
  #
  # These entries are executable, not descriptive: an SDK builds the bytes from
  # what is written here and holds no per-SKU logic of its own. Two small
  # languages do the work.
  #
  # `payload:` — the msg.data template. A string that is exactly "${name}" is
  # replaced by the argument `name`; every other string is a literal. "${frame}"
  # is reserved and holds the base64 of the frame built below.
  #
  # `frame:` — the byte layout of a raw-channel frame, whitespace-separated:
  #
  #   BB                     a literal byte, two hex digits
  #   ${name}                one byte, from the integer argument `name`
  #   ${name:16}             two bytes, big-endian
  #   <op:B0>                the opcode, one or more literal bytes. Marks where
  #                          the payload begins.
  #   <len:16>               the payload length, big-endian, filled in on build.
  #                          It counts the bytes after <op:…>, up to but
  #                          excluding the checksum, so a frame using it must
  #                          name its opcode with <op:…> right after.
  #   (${list}:rgb)×${n}     `n` RGB triples taken from the list argument `list`.
  #                          Omit `n` at call time and it is derived from the
  #                          list length.
  #   <xor>                  XOR of every preceding byte. Must come last.
  #
  # `args:` — one entry per argument, either
  #   { type: int, range: [min, max] }        inclusive bounds
  #   { type: rgb_list, max_len: <n> }        a list of RGB triples
  # Bounds are enforced, never clamped: the firmware clamps in silence
  # (../docs/protocol/lan.md 2.1), and an SDK that did the same would report
  # success for a value the device did not apply.
  lan:
    # <command-name>:
    #   cmd: <string sent in msg.cmd>
    #   documented: true | false      # false = discovered by reverse engineering
    #   role: status                  # optional; see below. Default: no role.
    #   payload: { }                  # JSON structure, ${placeholders} for args
    #   frame: ""                     # for raw-channel commands, the byte layout
    #   args: { <name>: { type, range } }
    #   notes: ""                     # behavior worth knowing before calling it;
    #                                 # required when documented is false, and it
    #                                 # must point at ../docs/protocol/lan.md
    #   capture: tests/fixtures/lan-captures/<sku>/<file>
    #
    # `role:` names the entry an SDK issues on its own initiative, so that no
    # command name has to live in SDK code. `status` is the one role there is:
    # it marks the command that reports the device's state, which fire-and-verify
    # sends after a command. At most one entry per mode may claim it. A file that
    # marks none simply has no status command: the SDK skips verification and
    # `status()` fails, rather than guessing an entry name.
  ble:
    # <command-name>:
    #   opcode: "0x.."
    #   frame: "..."                  # same layout language as above
    #   args: { }
    #   capture: tests/fixtures/ble-captures/<sku>/<file>
  cloud:
    # <command-name>:
    #   endpoint: ""
    #   body: { }

measurements: {}        # optional — numbers taken from a physical unit:
                        # native_pixels, latency, sustainable frame rate…
                        # Always record the unit's length alongside them; these
                        # are properties of a unit, not only of a SKU.

verified:
  by: ""                # who tested it
  firmware: ""          # wifi / ble firmware version tested against
  date: ""              # YYYY-MM-DD
  notes: ""             # what was actually exercised, and what was not

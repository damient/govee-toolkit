# govee-toolkit — device definition schema.
#
# This is a reference, not a device. See README.md for the how-to, and any
# device file beside it for a real entry.

schema_version: 1

sku: ""                 # required — e.g. "H61A0"
family: ""              # required — e.g. "rgbic-strip"
name: ""                # required — human-readable model name
aliases: []             # optional — other SKUs VERIFIED to share this definition
candidate_aliases: []   # optional — SKUs that look like the same product, but
                        # nobody verified. Verify one before you move it into
                        # aliases. A family resemblance is not evidence.

# optional — shared command tables to pull in, by the `family:` each declares.
# A fragment lives in `families/` and holds a dialect several SKUs speak to the
# byte: same frames, same ranges, same argument roles, and no measurement. The
# loader merges its commands into `commands:` below, so nothing downstream —
# validation, the encoder, `catalog.json` — can tell an included entry from a
# local one.
#
#   include:
#     - ble-wifi-provision
#
# Two errors, never warnings: a name no fragment declares, and a command this
# file and the fragment both declare. Include a family only where somebody
# exercised it on this SKU; what that unit answered stays under `verified:`.
include: []

capabilities:
  # What the hardware can do, in any mode. One entry per capability the device
  # has. A capability it does not have is ABSENT, never `false`. An entry with
  # nothing to qualify it carries no value.
  #
  # The names are open: a device can declare a name no SDK knows, and the
  # compatibility table gives it a column. The parameters are closed: a
  # parameter the codec does not know makes the file fail to load.
  #
  #   power:
  #   brightness:         { range: [1, 100] }
  #   colortemp:          { range_kelvin: [2000, 9000] }
  #   color:
  #   segments:           { count: 10, native_pixels: 42 }
  #   segment_brightness:
  #   sensors:
  #
  # `segments.count` is the zones the Govee app exposes.
  # `segments.native_pixels` is the addressable LEDs. It depends on the LENGTH
  # of the unit, not only on the SKU: record a measured value, or leave it out.
  # Never extrapolate one.

modes:
  # Which modes the hardware SUPPORTS. The user enables supported modes per
  # device, in the runtime config. See ../docs/modes.md.
  #
  # support: full | capped | partial | none | unknown
  #   full    — the mode reaches every capability the hardware has
  #   capped  — the mode reaches every capability the TRANSPORT carries, and
  #             the transport carries less than the hardware has. Every name
  #             under `unreachable` is `transport`. A boundary, not work left
  #   partial — a name under `unreachable` is `unimplemented` or `unprobed`.
  #             Work left on this device file
  #   none    — somebody established that the hardware cannot do this mode
  #   unknown — nobody probed it. This is the default. A failed probe and an
  #             unimplemented feature look identical from outside
  #
  # The level follows from the reasons, and `cargo test` checks it against
  # them: do not write `partial` for a transport boundary.
  #
  # capabilities: the names above this mode reaches; "all" means every
  #               capability the hardware has.
  # unreachable:  the names it does not reach, each with a reason. The
  #               vocabulary is `transport` | `unimplemented` | `unprobed`, and
  #               ../docs/compatibility.md says what each one claims.
  #
  # On a `full`, `capped` or `partial` mode, the two lists must account for
  # every capability above: `cargo test` fails on one that is neither reached
  # nor explained. A mode left `unknown` is exempt.
  lan:
    support: unknown
    capabilities: []
    unreachable: {}
    notes: ""
  ble:
    support: unknown
    capabilities: []
    unreachable: {}
    notes: ""
  cloud:
    support: unknown
    capabilities: []
    unreachable: {}
    notes: ""

commands:
  # One table per mode. A command absent from a mode is not reachable in
  # that mode — the SDK must fail explicitly rather than approximate it.
  #
  # These entries are executable, not descriptive: an SDK builds the bytes from
  # what this file says and holds no per-SKU logic of its own.
  #
  # `payload:` — the msg.data template. A string that is exactly "${name}" is
  # replaced by the argument `name`; every other string is a literal. "${frame}"
  # is reserved and holds the base64 of the frame built below.
  #
  # `frame:` — the byte layout of a raw-channel frame, whitespace-separated:
  #
  #   BB                     a literal byte, two hex digits
  #   ${name}                one byte, from the integer argument `name`
  #   ${name:16}             two bytes, big-endian
  #   ${name:str8}           one length byte, then `name` as UTF-8
  #   ${name:str16}          two big-endian length bytes, then `name` as UTF-8
  #   ${name:mask8}          one byte of zone bits, least significant bit first
  #   ${name:mask16}         two bytes of the same
  #   ${name:mask32}         four bytes of the same
  #   ${name:bytes}          the bytes of `name`, as they are
  #   <op:B0>                the opcode, one or more literal bytes. Marks where
  #                          the payload begins.
  #   <len:16>               the payload length, big-endian, filled in on
  #                          build. It counts the bytes after <op:…>, up to but
  #                          not including the checksum. A frame that uses it
  #                          must name its opcode with <op:…> right after.
  #   <pad:20>               zeros, so that the frame is 20 bytes once the
  #                          checksum follows. One per layout, and it comes
  #                          second to last. A layout already past that size is
  #                          an error, never a truncation.
  #   (${list}:rgb)×${n}     `n` RGB triples from the list argument `list`. Omit
  #                          `n` at call time and the codec derives it from the
  #                          list length. An ASCII `x` is accepted for `×`.
  #   <xor>                  XOR of every preceding byte. Must come last.
  #   <sum>                  low byte of the sum of every preceding byte. Must
  #                          come last. A layout carries <xor> or <sum>, never
  #                          both. The wire decides which: the 20-byte frames
  #                          take <xor> and the short host-audio frames take
  #                          <sum>.
  #
  # Two errors, because the field would carry something other than what the
  # caller asked for:
  #   - a string longer than its length prefix can count;
  #   - a zone index past the width of its mask.
  #
  # `body:` and `chunk:` — a payload longer than one frame, for a wire whose
  # frames have a fixed size. `body:` is a frame layout with no checksum.
  # `chunk:` says how to cut it and what to wrap each slice in. Declare the two
  # together, and neither `frame:` nor `frames:` beside them:
  #
  #   body: "${network:str8} ${password:str8}"
  #   chunk:
  #     size: 16                                          # body bytes per frame
  #     header: "A1 <op:11> 00 ${count} 00 <pad:20> <xor>"
  #     data:   "A1 <op:11> ${index} ${chunk:bytes} <pad:20> <xor>"
  #     footer: "A1 <op:11> FF <pad:20> <xor>"
  #
  # The codec fills in four names, and `args:` must declare none of them:
  #
  #   count      the number of data frames
  #   total      the number of frames in the transfer, the header and the
  #              footer included
  #   index      which data frame this is, counting from 1
  #   chunk      the slice of the body this frame carries
  #
  # Two more keys, for a wire that cuts a body the other way. Both are optional
  # and both default to off:
  #
  #   head_size: 13    body bytes the HEADER carries, before the first data
  #                    frame. The header layout must then read `${chunk:bytes}`,
  #                    and a layout that reads it must set this. Omit both and
  #                    the header carries no body.
  #   then: "…"        one frame sent AFTER the footer, for a wire that stores
  #                    the transfer and plays it with a second frame.
  #
  # A footer layout that reads `${chunk:bytes}` carries the LAST slice, so that
  # slice is not a data frame. A footer that reads none closes the transfer
  # empty. Nothing declares this: the footer layout says it.
  #
  #   chunk:
  #     size: 17
  #     head_size: 13
  #     header: "A3 00 01 ${total} 41 ${effect} ${chunk:bytes} <pad:20> <xor>"
  #     data:   "A3 ${index} ${chunk:bytes} <pad:20> <xor>"
  #     footer: "A3 FF ${chunk:bytes} <pad:20> <xor>"
  #     then:   "33 05 13 ${effect} ${sensitivity} <pad:20> <xor>"
  #
  # `reply:` — the layout of the answer a `frame:` asks for, in the same
  # grammar in the matching direction. It only matches bytes, so it refuses the
  # tokens that build bytes — <xor>, <len:…>, <op:…>, <pad:…> and a repeat
  # group. What it takes:
  #
  #   BB                     that literal byte, which the reply must carry
  #   ${name}                one byte, captured as an integer
  #   ${name:16}             two bytes, big-endian
  #   ${name:bytes:6}        exactly six bytes, as they are
  #   ${name:ascii}          the rest of the reply as text, without trailing
  #                          zeros. It reads to the end, so it must come last,
  #                          and it must keep printable ASCII only.
  #   ${name:ascii:17}       exactly seventeen bytes, read the same way.
  #
  # A reply that misses a literal the layout requires is refused whole: a frame
  # that does not match is another command's answer, and the codec reads
  # nothing partial out of it. Bytes past the layout are ignored.
  #
  # `frames:` — a list of send/reply pairs. The codec sends them in order and
  # merges the captures into one set of fields, so one entry can read several
  # values. Every step must declare both halves. A step with no `reply:` would
  # go out on a read and report nothing:
  #
  #   frames:
  #     - send:  "AA 01 <pad:20> <xor>"
  #       reply: "AA 01 ${lit}"
  #     - send:  "AA 04 <pad:20> <xor>"
  #       reply: "AA 04 ${level}"
  #
  # `args:` — one entry per argument, sent or captured:
  #   { type: int, range: [min, max] }        inclusive bounds
  #   { type: rgb_list, max_len: <n> }        a list of RGB triples
  #   { type: string, max_len: <n> }          text; the cap counts UTF-8 bytes
  #   { type: zones, count: <n> }             zone indices, sent as a bitmask
  #   { type: bytes, max_len: <n> }           bytes the SDK does not interpret
  # The codec enforces bounds and never clamps them: the firmware clamps in
  # silence (../docs/protocol/lan.md 2.1), and an SDK that did the same would
  # report success for a value the device did not apply.
  #
  # Any kind takes an optional `role:`. It names the argument for an SDK that
  # fills it, or reads it back, on its own initiative — see the command `role:`
  # below. At most one argument per command can claim a given role, and each
  # role has a fixed type:
  #
  #   enable      int       the flag a `segment_enable` command arms on
  #   colors      rgb_list  one triple per zone for a `segment_color` command;
  #                         the single triple a `segment_color_masked` frame
  #                         paints
  #   zones       zones     which zones a `segment_color_masked` command
  #                         paints, and which a `color_temp` frame with a mask
  #                         applies to
  #   gradient    int       whether the firmware interpolates between zones,
  #                         on a `segment_color` or `segment_gradient` command
  #   "on"        int       the flag a `power` command sets, and the field a
  #                         reply reports it in: non-zero is on
  #   brightness  int       the level a `brightness` command sets, and the
  #                         field a reply reports, in the unit the firmware
  #                         uses
  #   red         int       the components a `color` command sets
  #   green       int
  #   blue        int
  #   color_temp  int       the temperature in kelvin a `color_temp` command
  #                         sets, and the field a reply reports it in: 0
  #                         reports a device in color mode
  #   white_red   int       the RGB rendering of that temperature, where the
  #   white_green int       frame carries it. The SDK computes all three from
  #   white_blue  int       the kelvin value
  #   effect      int       which effect a `music` command plays
  #   sensitivity int       how loud the sound must be for that command to
  #                         answer it
  #   soft        int       whether that command renders in fades rather than
  #                         on the beat
  #   color_mode  int       whether that command imposes a color: 0 leaves the
  #                         colors to the firmware, 1 plays the triple the
  #                         same command marks red, green and blue
  #
  # Quote `role: "on"`: a YAML 1.1 reader takes a bare `on` for true.
  # A captured field with no role reaches the caller under the name this file
  # gave it.
  lan:
    # <command-name>:
    #   cmd: <string sent in msg.cmd>
    #   role: status                  # optional; see below. Default: no role.
    #   payload: { }                  # JSON structure, ${placeholders} for args
    #   frame: ""                     # for raw-channel commands, the byte layout
    #   reply: ""                     # the answer that frame asks for
    #   frames: [ { send, reply } ]   # several exchanges instead of one frame
    #   body: ""                      # a payload longer than one frame…
    #   chunk: { size, head_size, header, data, footer, then }  # …how to cut it
    #   args: { <name>: { type, range, role } }
    #   notes: ""                     # behavior worth knowing before calling it
    #
    # `role:` names an entry an SDK issues on its own initiative, so that no
    # command name lives in SDK code. At most one entry per mode can claim a
    # given role. A role nobody claims has no command: the SDK does without it
    # and says so, rather than guessing an entry name.
    #
    #   status          reports the device's state. Fire-and-verify sends it
    #                   after a command, and `status()` encodes it. Unclaimed:
    #                   commands go unverified and `status()` fails.
    #   power           turns the device on and off.
    #   brightness      sets the brightness, in the unit the argument's
    #                   `range:` gives.
    #   color           sets one color over the whole device. Claim it on an
    #                   entry that paints the whole device from a triple, not
    #                   on one that paints a zone list: the SDK approximates
    #                   neither.
    #   color_temp      sets the white temperature. White and color are
    #                   mutually exclusive states, so this ends the color the
    #                   device showed.
    #   segment_enable  arms and disarms the raw segment channel. Unclaimed:
    #                   nothing is armed, which is what a mode whose zones are
    #                   always addressable looks like.
    #   segment_color   paints every zone at once.
    #   segment_color_masked
    #                   paints one color over the zones a mask names. A stream
    #                   over it sends one frame per distinct color, so declare
    #                   it where the mode carries no whole-frame command. Where
    #                   both are claimed, the SDK uses the whole-frame one.
    #   segment_gradient
    #                   sets whether the firmware interpolates between zones,
    #                   where the mode carries that outside the painting frame.
    #                   Declare it there instead of a `role: gradient`
    #                   argument. An SDK sends it when a stream opens.
    #   music           plays an effect the device renders from its own
    #                   microphone. The effect identifiers are the mode's own:
    #                   the same number names another effect over another
    #                   mode. No entry stops the effect — an SDK ends it with
    #                   another command.
    #
    # Four more put a device on a Wi-Fi network. An SDK runs them in one
    # order that no key here expresses: wake, wait, transfer, release. Declare
    # all four or none — `provision_wifi()` fails on a file that claims some.
    #
    #   wifi_link       wakes the Wi-Fi module before the transfer, and
    #                   releases it after.
    #   wifi_api_type   reports which endpoint the device asks for. The SDK
    #                   maps the type to a URL. Unclaimed: the SDK provisions
    #                   with `wifi_provision`.
    #   wifi_provision  carries the credentials.
    #   wifi_provision_with_api
    #                   the same, ending in that URL. This language carries no
    #                   optional field, so the two are separate entries and the
    #                   SDK picks by what `wifi_api_type` answered.
    #
    # An SDK knows no argument name either, so a role it fills arguments for
    # marks them with an argument `role:`:
    #
    #   power           one argument marked `role: "on"`
    #   brightness      one marked `role: brightness`
    #   color           one each of `role: red`, `role: green` and
    #                   `role: blue`
    #   color_temp      one argument marked `role: color_temp`. Where the
    #                   firmware renders nothing and the frame carries the
    #                   rendering, three more: `role: white_red`,
    #                   `role: white_green` and `role: white_blue`. Declare
    #                   all three or none. Where the frame names the zones it
    #                   applies to, one marked `role: zones` as well: the SDK
    #                   fills it with every zone the mask can name. That bound
    #                   is the `count:` on the zone argument, or the width of
    #                   the mask field where the file declares no `count:`. A
    #                   mask the file bounds by nothing is an error, because
    #                   the zones past the bound would hold the color they had.
    #   segment_enable  one argument marked `role: enable`
    #   segment_color   one marked `role: colors`. The SDK also supplies one
    #                   marked `role: gradient`, if this file declares one. The
    #                   repeat count comes from the list and needs no role.
    #   segment_color_masked
    #                   one marked `role: colors` and one marked `role: zones`.
    #                   An SDK refuses a larger stream against the `count:` on
    #                   the zone argument, so record it: the firmware drops a
    #                   mask with bits past the last zone in silence.
    #   segment_gradient
    #                   one marked `role: gradient`.
    #   music           one argument marked `role: effect`. The SDK also
    #                   supplies the ones marked `role: sensitivity`,
    #                   `role: soft`, `role: color_mode`, `role: red`,
    #                   `role: green` and `role: blue`, where this file
    #                   declares them. Declare the last four together or not
    #                   at all.
    #   wifi_link       one marked `role: enable`.
    #   wifi_api_type   one captured field marked `role: api_type`. A second,
    #                   `role: hide_ssid`, records whether the device wants the
    #                   hidden-network flag. Nothing encodes that flag yet.
    #   wifi_provision  one each of `role: network`, `role: password`,
    #                   `role: run_mode`, `role: timezone_hours`,
    #                   `role: timezone_minutes` and `role: iot_version`. The
    #                   caller supplies the first two and the offset; the SDK
    #                   sends 0 for the run mode and the IoT version.
    #   wifi_provision_with_api
    #                   all of those, plus one marked `role: api_url`.
  ble:
    # <command-name>:
    #   role: status                  # same roles as above
    #   frame: ""                     # same layout language as above; the wire
    #                                 # carries no envelope, so there is no
    #                                 # `cmd:` and no `payload:` here
    #   reply: ""                     # the answer that frame asks for
    #   frames: [ { send, reply } ]   # several exchanges instead of one frame
    #   body: ""                      # a payload longer than one frame…
    #   chunk: { size, head_size, header, data, footer, then }  # …how to cut it
    #   args: { <name>: { type, range, role } }
    #   notes: ""                     # behavior worth knowing before calling it
    #
    # A frame on the 20-byte channel has a fixed size and carries its own
    # checksum, so each layout ends with `<pad:N> <xor>`, the three inside
    # `chunk:` included. The host-audio channel carries short frames instead:
    # those take `<sum>` and no padding. `body:` is the exception to both: it
    # is the payload the codec cuts up, not a frame, so it takes neither.
  cloud:
    # <command-name>:
    #   capability:                   # what the API calls what this command
    #     type: ""                    # writes, spelled as the API spells it
    #     instance: ""
    #   payload: "${name}"            # the capability value, in the same
    #                                 # language as above
    #   role: status                  # same roles as above
    #   reads:                        # on a `role: status` entry, which
    #     - instance: ""              # argument each capability answers into.
    #       arg: ""                   # That argument's `role:` says which
    #                                 # field of the status it fills
    #   args: { <name>: { type, range, role } }
    #   notes: ""                     # behavior worth knowing before calling it
    #
    # An entry writes one capability or reads capabilities back, never both.
    #
    # `${r,g,b:rgb24}` is the placeholder this table adds: the three channel
    # arguments, packed into 0xRRGGBB. `${<name>:rgb24}` packs the one triple
    # of an `rgb_list` argument the same way, which is what an entry marked
    # `role: segment_color_masked` takes: the list holds exactly one color, and
    # any other length is an error. A `zones` argument becomes an array of zone
    # indices, ascending and each index once, where a frame carries a mask. All
    # three keep the argument names the `lan` and `ble` layouts give them, so
    # one command takes the same arguments over every mode.

measurements: {}        # optional — numbers taken from a physical unit:
                        # native_pixels, latency, sustainable frame rate…
                        # Always record the unit's length with them. These are
                        # properties of a unit, not only of a SKU.
                        #
                        # Free-form except for five entries an SDK reads:
                        # `frame_rate`, `resolution_changepoints`,
                        # `arm_settle_ms`, `ble.write_budget_hz` and
                        # `ble.write_drain_ms`.
                        #
                        # `resolution_changepoints` is every zone count at
                        # which this unit refines, as a list:
                        #
                        #   resolution_changepoints: [1, 2, 3, 5, 7, 21, 42]
                        #
                        # The firmware groups the LEDs to serve the count a
                        # frame states, so a count between two of these renders
                        # as the lower one. The SDK refuses such a count rather
                        # than let the firmware approximate the frame. Sweep
                        # the counts to measure them — see
                        # ../docs/protocol/lan.md 2.3 — and leave the list out
                        # where nobody swept them.
                        #
                        # `arm_settle_ms` is how long the SDK waits after the
                        # `role: segment_enable` frame, before the first paint.
                        # The firmware needs that long to switch channel, and
                        # it drops an earlier paint in silence: the channel
                        # answers nothing either way, so the paint is lost
                        # without an error. Measure it: arm the channel, wait
                        # n ms, paint a subset of the zones, and look at the
                        # unit. A file that records nothing gets a
                        # conservative default, which is never zero. See
                        # ../docs/protocol/lan.md 2.3.
                        #
                        # `ble.write_budget_hz` is the sustained rate the `ble`
                        # transport paces its writes to, at or under the
                        # `ble.sustained_writes_hz` the unit held. A file that
                        # records neither is written at the SDK's own fallback.
                        # `ble.burst_frames_before_stall` is never a burst
                        # allowance: it is the count that broke a unit.
                        #
                        # `ble.write_drain_ms` is how long the `ble` transport
                        # holds a link open after the last write. A link
                        # dropped sooner loses the frame in silence. Measure
                        # it: write a value, close the link after n ms, then
                        # read the value back.
                        #
                        # `frame_rate` paces the segment stream, so its rows
                        # have a fixed shape:
                        #
                        #   frame_rate:
                        #     - { zones: <n>, payload_bytes: <n>,
                        #         clean_hz: <n>, breaks_at_hz: <n> }
                        #
                        # A bare list is the `lan` table. Rows measured over
                        # another mode go under its name. Never carry a rate
                        # from one mode to another:
                        #
                        #   frame_rate:
                        #     lan:
                        #       - { zones: <n>, clean_hz: <n> }
                        #     ble:
                        #       - { zones: <n>, clean_hz: <n> }
                        #
                        # The stream uses `zones` and `clean_hz`: the highest
                        # rate that zone count sustained without visible
                        # stutter. A row is a measurement, never arithmetic on
                        # another number. Leave out a rate nobody watched.
                        # Leave the table out and the stream falls back to a
                        # conservative rate, and reports that it did. See
                        # ../docs/protocol/lan.md 2.7.

verified:
  by: ""                # who tested it
  firmware: ""          # wifi / ble firmware version tested against
  date: ""              # YYYY-MM-DD
  notes: ""             # what was actually exercised, and what was not

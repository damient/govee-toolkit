# Nothing here is measured: what one unit answered belongs in that unit's
# device file, under `verified:`.

schema_version: 1

family: "ble-segments"

description: >-
  The four entries of sub-mode 21, which addresses zones through a mask 15
  bits wide: one color over a subset, brightness over a subset, brightness
  over every zone at once, and whether the firmware interpolates between two
  zones. See docs/protocol/ble.md 2.3 to 2.6.

commands:
  ble:
    segment_color:
      role: segment_color_masked
      frame: "33 05 15 01 (${colors}:rgb)×${nb} 00 00 00 00 00 ${zones:mask16} <pad:20> <xor>"
      args:
        colors: { type: rgb_list, max_len: 1, role: colors }
        nb: { type: int, range: [1, 1] }
        zones: { type: zones, count: 15, role: zones }
      notes: >-
        Paints one color over the zones the mask names, and leaves the rest
        alone. The kelvin and white fields stay zero: color and white are
        mutually exclusive, and a non-zero kelvin is what turns this frame
        into the white one. Trap: a saturated mask looks exactly like an
        ignored mask, so painting every zone proves nothing about the mask
        being read — paint a subset.

    segment_brightness_masked:
      frame: "33 05 15 02 ${level} ${zones:mask16} <pad:20> <xor>"
      args:
        level: { type: int, range: [1, 100] }
        zones: { type: zones, count: 15 }

    segment_brightness:
      frame: "33 05 15 03 ${levels:bytes} <pad:20> <xor>"
      args:
        levels: { type: bytes, max_len: 15 }
      notes: >-
        Every zone at once, one byte each in zone order, and there is no mask:
        pass all fifteen. A shorter list is padded with zeros, which sets the
        zones it does not cover to zero rather than leaving them alone. The
        bytes are not interpreted here, so nothing checks each one against the
        1..100 the firmware takes: a 0 or a 200 in the list reaches the device
        and the firmware clamps it in silence. TODO: give the `bytes` type a
        per-element range, then add the error vector it makes writable.

    gradient:
      role: segment_gradient
      frame: "33 A3 ${on} <pad:20> <xor>"
      args:
        on: { type: int, range: [0, 1], role: gradient }
      notes: >-
        Whether the firmware interpolates between zones, wrapping from the
        last back to the first; 0 gives hard-edged zones. The same setting the
        lan segment channel carries as its `gradient` argument. It is not a
        fade over time: what changes is the boundary between two zones painted
        differently.

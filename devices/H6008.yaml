# On Govee's official LAN-control list — see ../docs/lan-supported-devices.md.
# Govee's own list names it "Wi-Fi+BLE RGBWW LED Bulb".

schema_version: 1

sku: "H6008"
family: "rgbww-bulb"
name: "Smart LED Bulb RGBWW"
aliases: []
include:
  - lan-documented
  - ble-core
  - ble-color
  - ble-version-06
  - ble-wifi-provision
  - cloud-openapi

candidate_aliases:      # Govee's LAN list gives each of these the same
  - H6004               # description as the H6008. Nobody verified one. The
  - H6006               # white range is a property of the unit, so measure it
  - H6009               # again on each. H6003 carries the same description and
  - H600A               # is absent here: Govee gives that model one radio,
  - H6010               # Wi-Fi.

capabilities:
  power:
  brightness:  { range: [1, 100] }
  color:
  colortemp:   { range_kelvin: [2700, 6500] }   # measured, see verified below
  # No music: the bulb carries no microphone, so no mode renders sound.
  # See verified below.
  # No segments and no segment_brightness: the bulb shows one color.

modes:
  lan:
    support: full
    capabilities: [power, brightness, color, colortemp]
    unreachable: {}
    notes: >-
      Requires LAN Control enabled in the Govee Home app. The four documented
      commands answer, and the undocumented `status` command of
      docs/protocol/lan.md 2.2 answers as well.
  ble:
    support: full
    capabilities: [power, brightness, color, colortemp]
    unreachable: {}
    notes: >-
      Reaches every capability, over an encoded link. The unit sets the
      encoding flag of docs/protocol/ble.md 1.5, so it takes the 20-byte
      dialect of 2 and 3 encoded and answers a plaintext frame with nothing.
      The transport runs the handshake of 9, then power, brightness, colour
      and the white temperature all answer, read back over the `status` and
      `read_mode` frames below. Colour and white share sub-mode 13: the frame
      carries a colour triplet, a kelvin value and a white triplet, and which
      is non-zero says which the firmware renders. The host colour channel of 8
      also answers, in the clear, and is kept as `host_color`: it is the
      phone-driven colour path, not a substitute for `color`. The advertised
      name is the `GV` form of 1.3, so a scan reports the unit and reads its
      SKU. Wi-Fi provisioning of 4 works as well, and the unit accepts it while
      it is already on a network.
  cloud:
    support: full
    capabilities: [power, brightness, color, colortemp]
    unreachable: {}
    notes: >-
      Needs an API key. The account lists this model with four writable
      capabilities. The white bounds are the ones the firmware applies, not the
      ones the API declares: see the `colortemp` entry.

commands:
  # Every frame here is 20 bytes: proType, commandType, payload, then a XOR of
  # the 19 bytes before it. See docs/protocol/ble.md 1.2.
  ble:
    colortemp:
      role: color_temp
      frame: "33 05 0D 00 00 00 ${kelvin:16} ${white_r} ${white_g} ${white_b} <pad:20> <xor>"
      args:
        kelvin: { type: int, range: colortemp.range_kelvin, role: color_temp }
        white_r: { type: int, range: [0, 255], role: white_red }
        white_g: { type: int, range: [0, 255], role: white_green }
        white_b: { type: int, range: [0, 255], role: white_blue }
      notes: >-
        Sub-mode 13 with the colour triplet at zero. See docs/protocol/ble.md
        2.3.
    host_color:
      frame: "A5 02 83 ${r} ${g} ${b} <sum>"
      args:
        r: { type: int, range: [0, 255], role: red }
        g: { type: int, range: [0, 255], role: green }
        b: { type: int, range: [0, 255], role: blue }
      notes: >-
        The host colour channel, not the colour command the other two modes
        carry. Three differences, each of them measured on this unit. The
        firmware holds the colour for `measurements.ble.render_hold_ms` and
        then returns to the state it stores, so a caller that wants the colour
        to stay must send the frame again. No read reports the colour while it
        plays: the `ble` reads answer nothing here, and the `lan` status keeps
        reporting the stored state. The frame renders on a bulb whose stored
        state is `off`, and leaves that state `off`. The stored brightness
        scales the render, and `00 00 00` renders dark without turning the bulb
        off. See docs/protocol/ble.md 8.

    channel_probe:
      frame: "A5 02 90 <sum>"
      args: {}
      notes: >-
        Asks whether the unit carries the channel above. It answers
        `cd ec 50 5e b7`, the same five bytes on both units measured. Nobody
        established the layout of that answer, so this entry declares no
        `reply:`. See docs/protocol/ble.md 8.

overrides:
  lan:
    brightness:
      notes: >-
        This firmware does not clamp, which docs/protocol/lan.md 2.1 describes
        for the models that do. It stores the byte it receives and reports it
        back: 0 reads as 0, 101 reads as 101, and 200 reads as -56. The range
        above is the one the phone controller uses, and the codec enforces it.

    colortemp:
      notes_append: >-
        It clamps a value outside the range above in silence. See
        docs/protocol/lan.md 1, "Documented commands".

  ble:
    power:
      notes: "See docs/protocol/ble.md 2.1. This unit takes it encoded, see 9."

    brightness:
      notes: "Percent. See docs/protocol/ble.md 2.2."

  cloud:
    brightness:
      notes: >-
        Percent. The API documents 0 as well, and nobody probed it over this
        mode. This firmware does not clamp over `lan`, so what 0 reaches here
        is unknown.

    colortemp:
      notes: >-
        The account declares 2000 to 9000 K for this model. The firmware
        applies 2700 to 6500, the same bounds it applies over `lan`: the API
        answers success for 2000 and for 9000, and the state endpoint then
        reports the bound. The range above is what the device applies.

measurements:
  # Taken on the unit whose versions `verified` names.
  ble:
    read_round_trip_ms: 49        # host colour channel probe, median of 20,
                                  # 39 ms at best. Taken before the firmware
                                  # update below; not retaken over the encoding
    render_hold_ms: 60000         # host colour render, against a stored state
                                  # of on. A stored state of off ended no
                                  # render, see `verified:`
    write_drain_ms: 25            # host colour channel, the shortest wait that
                                  # rendered. 20 ms lost the frame. One trial
                                  # per step, so this is the edge, not a margin

verified:
  by: "damient"
  firmware: "1.01.25"
  date: "2026-09-13"
  notes: >-
    lan mode exercised over UDP on two units, against wifi version 1.01.12.
    Both units answered the multicast discovery and every command in the table
    above, read back through devStatus. Brightness was walked over 0, 1, 50,
    100, 101, 200 and 255: the firmware stores what it receives, so 101 reads
    back as 101 and 200 as -56, and nothing was clamped. The white range was
    measured by anchoring the bulb at one temperature and then asking for
    another, so that a clamp reads as a move to the bound and a refusal reads
    as the anchor. The bounds are 2700 and 6500 K, walked one kelvin at a time,
    and the same on both units. The undocumented `status` command answers a
    `pt` of `bb 01 00 b2 00 08`, the 0xB2 frame of docs/protocol/lan.md 2.3.
    The `razer` segment channel was NOT probed.

    cloud mode exercised against a live account on the same unit. Power,
    brightness, color and white were written and read back through the state
    endpoint. The account declares a white range of 2000 to 9000 K and the unit
    applies 2700 to 6500: the control endpoint answered success for both
    bounds, and the state endpoint then reported the applied value. An answer
    of success is not an applied value.

    The bulb carries no microphone, so no mode renders sound. The cloud probe
    agrees: the account lists no `music_setting` capability for this model, and
    the control endpoint answered HTTP 400 `devices not support this instance`
    for it. So the capability is absent above rather than unreachable per mode.

    ble mode reaches every capability, over the encoded link of
    docs/protocol/ble.md 9. The unit advertises as `GVH6008` plus four hex
    digits, which carry the last two bytes of its Wi-Fi MAC with the final byte
    one higher — that held on both units. It accepts one GATT link, carries the
    write and notify characteristics of docs/protocol/ble.md 1.1, and no
    `2b12` characteristic. Its advertisement field reads `43 88 ec 00 01 01`:
    the encoding flag set, layout version 3, pactType 1, pactCode 1. A
    plaintext frame draws no notification and no error, and that silence is the
    encoding and not a missing dialect.

    Over the encoded link, power, brightness, colour and the white temperature
    each answered and read back, through the Rust CLI, which sends exactly the
    frames the device file declares. Colour and white share sub-mode 13. `AA
    06` answered ble version 1.01.25, higher than the 1.01.12 the wifi radio
    reported over lan, so the ble radio updated between sessions.

    The host colour channel works, in the clear alongside the encoded dialect.
    `A5 02 90` answers the same five bytes on both units, so those bytes are a
    property of the firmware and not of the unit. `A5 02 83 <R G B>` renders
    the triplet, and `00 00 00` renders dark. The second unit rendered orange
    from the frame that rendered red on the first. Byte 1 must be `02`: the
    probe under `00`, `01`, `03`, `04`, `06` and `90` answered nothing.

    The write is one direction only. A colour frame whose link was dropped as
    soon as the write returned rendered nothing, and nothing reported the loss.
    See `measurements.ble.write_drain_ms` and docs/protocol/ble.md 1.4.

    Three properties of the render were watched on the bulb. It survives the
    link going down. It lights a bulb whose stored state is `off`, and
    `devStatus` keeps reporting `on=false` through it. The stored brightness
    scales it: the same `FF FF FF` was dimmer at brightness 10 than at 100.
    What ends a render is the firmware asserting the state it stores, so
    against a stored state of `off` nothing ended it.

    The colour fade was probed and not found. This firmware always fades from
    one colour to the next, and no frame turned that off. `aa a3` answered
    nothing. `33 a3 00` drew no acknowledgement, where `33 01 01` answered
    `00` on the same link, and the fade survived it. `33 14 00` did the same,
    and `aa 14` reads the Wi-Fi MAC instead. See docs/protocol/ble.md 2.6.

    Wi-Fi provisioning works on this unit, over the encoded link. `AA AB`
    answers type 2 and no hidden-network flag, so the transfer carries the
    endpoint block. The unit was already on a network and bound to an account,
    and it still accepted the transfer: it answered `A1 11 00` and it joined
    the new network, which lan then reached. `33 17 01` draws no answer, and
    none is due. Trap: the transfer needs 300 ms between frames. At the
    `measurements.ble.write_drain_ms` pace the unit answered nothing at all and
    stayed off the network. That number is the host colour channel and not this
    path. See tests/fixtures/ble-captures/H6008/provision.txt and
    docs/protocol/ble.md 4.

    The four version reads answer two values: `aa 06` and `aa 21` both answer
    1.01.25, and `aa 20` and `aa 07 03` both answer 1.07.03. The file declares
    `aa 06` alone, and nothing establishes which module each read names.

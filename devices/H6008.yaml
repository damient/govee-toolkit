# On Govee's official LAN-control list — see ../docs/lan-supported-devices.md.
# Govee's own list names it "Wi-Fi+BLE RGBWW LED Bulb".

schema_version: 1

sku: "H6008"
family: "rgbww-bulb"
name: "Smart LED Bulb RGBWW"
aliases: []

candidate_aliases:      # Govee's LAN list gives each of these the same
  - H6004               # description as the H6008. Nobody verified one. The
  - H6006               # white range is a property of the unit, so measure it
  - H6009               # again on each. H6003 carries the same description and
  - H600A               # is absent here: Govee gives that model one radio,
  - H6010               # Wi-Fi.

capabilities:
  power:
  brightness:  { range: [1, 100] }
  color:
  colortemp:   { range_kelvin: [2700, 6500] }   # measured, see verified below
  # No music: the bulb carries no microphone, so no mode renders sound. The
  # Govee app offers this model no music screen. See verified below.
  # No segments and no segment_brightness: the bulb shows one color.

modes:
  lan:
    support: full
    capabilities: [power, brightness, color, colortemp]
    unreachable: {}
    notes: >-
      Requires LAN Control enabled in the Govee Home app. The four documented
      commands answer, and the undocumented `status` command of
      docs/protocol/lan.md 2.2 answers as well.
  ble:
    support: partial
    capabilities: [color]
    unreachable:
      power: unprobed
      brightness: unprobed
      colortemp: unprobed
    notes: >-
      Reaches one channel: the host colour frames of docs/protocol/ble.md 8.
      The unit answers the channel request and renders the triplet it is sent.
      Three limits come with that channel, and the `color` command below states
      them: the render expires on its own, no read reports it, and the stored
      brightness scales it. The 20-byte dialect of docs/protocol/ble.md 2 and 3
      answers nothing on this unit and changes nothing that `lan` reads back.
      That is an unanswered question, not a boundary — see
      docs/protocol/ble.md 7. The advertised name is the `GV` form of
      docs/protocol/ble.md 1.3, so a scan reports the unit and reads its SKU.
  cloud:
    support: full
    capabilities: [power, brightness, color, colortemp]
    unreachable: {}
    notes: >-
      Needs an API key. The account lists this model with four writable
      capabilities. The white bounds are the ones the firmware applies, not the
      ones the API declares: see the `colortemp` entry.

commands:
  lan:
    power:
      cmd: "turn"
      documented: true
      role: power
      payload: { value: "${on}" }
      args:
        on: { type: int, range: [0, 1], role: "on" }

    brightness:
      cmd: "brightness"
      documented: true
      role: brightness
      payload: { value: "${level}" }
      args:
        level: { type: int, range: [1, 100], role: brightness }
      notes: >-
        This firmware does not clamp, which docs/protocol/lan.md 2.1 describes
        for the models that do. It stores the byte it receives and reports it
        back: 0 reads as 0, 101 reads as 101, and 200 reads as -56. The range
        above is the one the Govee app uses, and the codec enforces it.

    color:
      cmd: "colorwc"
      documented: true
      role: color
      payload:
        color: { r: "${r}", g: "${g}", b: "${b}" }
        colorTemInKelvin: 0
      args:
        r: { type: int, range: [0, 255], role: red }
        g: { type: int, range: [0, 255], role: green }
        b: { type: int, range: [0, 255], role: blue }

    colortemp:
      cmd: "colorwc"
      documented: true
      role: color_temp
      payload:
        color: { r: 0, g: 0, b: 0 }
        colorTemInKelvin: "${kelvin}"
      args:
        kelvin: { type: int, range: [2700, 6500], role: color_temp }
      notes: >-
        The firmware converts the temperature to RGB itself and ignores the
        color field, so the payload carries no white triplet and zeroes that
        field. It clamps a value outside the range above in silence. See
        docs/protocol/lan.md 1, "Documented commands".

    status:
      cmd: "devStatus"
      documented: true
      role: status
      payload: {}
      args: {}

    raw_status:
      cmd: "status"
      documented: false
      payload: {}
      args: {}
      notes: >-
        Returns onOff, brightness and a frozen base64 `pt` capability
        descriptor. Read-only in practice. See docs/protocol/lan.md 2.2.

  ble:
    color:
      documented: false
      role: color
      frame: "A5 02 83 ${r} ${g} ${b} <sum>"
      args:
        r: { type: int, range: [0, 255], role: red }
        g: { type: int, range: [0, 255], role: green }
        b: { type: int, range: [0, 255], role: blue }
      notes: >-
        The host colour channel, not the colour command the other two modes
        carry. Three differences, each of them measured on this unit. The
        firmware holds the colour for `measurements.ble.render_hold_ms` and
        then returns to the state it stores, so a caller that wants the colour
        to stay must send the frame again. No read reports the colour while it
        plays: the `ble` reads answer nothing here, and the `lan` status keeps
        reporting the stored state. The frame renders on a bulb whose stored
        state is `off`, and leaves that state `off`. The stored brightness
        scales the render, and `00 00 00` renders dark without turning the bulb
        off. See docs/protocol/ble.md 8.

    channel_probe:
      documented: false
      frame: "A5 02 90 <sum>"
      args: {}
      notes: >-
        Asks whether the unit carries the channel above. It answers
        `cd ec 50 5e b7`, the same five bytes on both units measured. Nobody
        established the layout of that answer, so this entry declares no
        `reply:`. See docs/protocol/ble.md 8.

  cloud:
    power:
      documented: true
      capability:
        type: "devices.capabilities.on_off"
        instance: "powerSwitch"
      role: power
      payload: "${on}"
      args:
        on: { type: int, range: [0, 1], role: "on" }

    brightness:
      documented: true
      capability:
        type: "devices.capabilities.range"
        instance: "brightness"
      role: brightness
      payload: "${level}"
      args:
        level: { type: int, range: [1, 100], role: brightness }

    color:
      documented: true
      capability:
        type: "devices.capabilities.color_setting"
        instance: "colorRgb"
      role: color
      payload: "${r,g,b:rgb24}"
      args:
        r: { type: int, range: [0, 255], role: red }
        g: { type: int, range: [0, 255], role: green }
        b: { type: int, range: [0, 255], role: blue }
      notes: >-
        This API carries the color as one integer. The three arguments keep the
        names the `lan` layout gives them, so one call reads the same over both
        modes.

    colortemp:
      documented: true
      role: color_temp
      capability:
        type: "devices.capabilities.color_setting"
        instance: "colorTemperatureK"
      payload: "${kelvin}"
      args:
        kelvin: { type: int, range: [2700, 6500], role: color_temp }
      notes: >-
        The account declares 2000 to 9000 K for this model. The firmware
        applies 2700 to 6500, the same bounds it applies over `lan`: the API
        answers success for 2000 and for 9000, and the state endpoint then
        reports the bound. The range above is what the device applies.

    status:
      documented: true
      role: status
      reads:
        - { instance: "powerSwitch", arg: "on" }
        - { instance: "brightness", arg: "level" }
        - { instance: "colorRgb", arg: "color" }
        - { instance: "colorTemperatureK", arg: "kelvin" }
      args:
        on: { type: int, range: [0, 1], role: "on" }
        level: { type: int, range: [0, 100], role: brightness }
        color: { type: int, range: [0, 16777215], role: color }
        kelvin: { type: int, range: [0, 9000], role: color_temp }
      notes: >-
        The ranges here are what an answer may carry, not what a caller may
        send: 0 kelvin reports color mode rather than a temperature.

measurements:
  # Taken on the unit whose versions `verified` names, over the host colour
  # channel of ../docs/protocol/ble.md 8. The 20-byte dialect answers nothing
  # here, so none of the numbers that dialect calls for were taken.
  ble:
    read_round_trip_ms: 49        # channel probe, median of 20, 39 ms at best
    render_hold_ms: 60000         # measured against a stored state of on. A
                                  # stored state of off ended no render, see
                                  # `verified:`
    write_drain_ms: 25            # the shortest wait that rendered. 20 ms lost
                                  # the frame. One trial per step, so this is
                                  # the edge and not a margin
    # TODO: measure `render_hold_ms`, how long the firmware holds a colour from
    # the host before it returns to its stored state. It held one for over a
    # minute, timed by eye and not to a figure worth recording. Nothing reads
    # the render back — the `ble` reads answer nothing, the `lan` status
    # reports the stored state, and the advertisement carries a constant — so
    # the measurement needs an eye on the bulb or a light sensor.

verified:
  by: "damient"
  firmware: "1.01.12"
  date: "2026-09-12"
  notes: >-
    lan mode exercised over UDP on two units, against wifi soft version 1.01.12
    and hard version 1.07.03, with the same two versions on the ble radio. Both
    units answered the multicast discovery and every command in the table
    above. Power, color and the two status commands were walked once each and
    read back through devStatus. Brightness was walked over 0, 1, 50, 100, 101,
    200 and 255: the firmware stores what it receives, so 101 reads back as 101
    and 200 as -56, and nothing was clamped. The white range was measured by
    anchoring the bulb at one temperature and then asking for another, so that
    a clamp reads as a move to the bound and a refusal reads as the anchor:
    2000 K from an anchor of 5000 K gives 2700 K, and 9000 K from an anchor of
    3000 K gives 6500 K. The bounds were then walked one kelvin at a time: 2700
    and 2701 are both applied, 2699 clamps up to 2700, 6499 and 6500 are both
    applied, and 6501 clamps down to 6500. Both units gave the same four
    numbers. The undocumented `status` command answers a `pt` of
    `bb 01 00 b2 00 08`, the 0xB2 frame of docs/protocol/lan.md 2.3 with a
    correct checksum. The `razer` segment channel was NOT probed.

    cloud mode exercised against a live account on the same unit, on the same
    date. Power, brightness, color and white were written and read back
    through the state endpoint. The account declares a white range of 2000 to
    9000 K for this model and the unit applies 2700 to 6500: the control
    endpoint answered success for 2000 K and for 9000 K, and the state
    endpoint then reported 2700 and 6500. So the same bounds hold over both
    modes, and an answer of success is not an applied value.

    The bulb carries no microphone. The owner established that in the Govee
    Home app: the app offers this model no music screen. The cloud probe
    agrees, and is the weaker of the two: the account lists no
    `music_setting` capability for this model, while it lists one for the
    H61A0, and the control endpoint answered HTTP 400 `devices not support
    this instance` for it. So no mode carries music here, and the capability
    is absent above rather than unreachable per mode.

    ble mode reaches the host colour channel of docs/protocol/ble.md 8 and
    nothing else. The unit advertises as `GVH6008` plus four hex digits, which
    carry the last two bytes of its Wi-Fi MAC with the final byte one higher —
    that held on both units. It accepts one GATT link and carries the write
    and notify characteristics of docs/protocol/ble.md 1.1, and no `2b12`
    characteristic.

    The 20-byte dialect answers nothing. Every command type under `AA` was
    walked, 0 to 255, and then every `proType` under command type `01`, 0 to
    255: 512 frames, no notification, no error on any write. A `33 01 00`
    power frame left the unit on, read back over `lan`. The notify
    characteristic is not the silent part: it was subscribed for all 512
    frames and it answers the channel probe below on the same subscription.
    Nothing here establishes that the hardware lacks that dialect — a
    malformed frame and an unimplemented command are the same silence, see
    docs/protocol/ble.md 7.

    The host colour channel works. `A5 02 90` answers `cd ec 50 5e b7`, the
    same five bytes on both units, so those bytes are a property of the
    firmware and not of the unit. `A5 02 83 <R G B>` renders the triplet: red,
    green, blue, cold white and a dim green were each sent and watched on the
    bulb, and `00 00 00` rendered dark. The second unit rendered orange from
    the same frame. Byte 1 must be `02`: the probe under `00`, `01`, `03`,
    `04`, `06` and `90` answered nothing.

    The write is one direction only, and this unit shows it. A colour frame
    whose link was dropped as soon as the write returned rendered nothing: the
    bulb stayed dark and nothing reported the loss. The wait was then walked in
    two passes, one frame per step, each step a colour of its own against a
    stored state of green: 0 ms and 20 ms rendered nothing, and 25, 30, 35, 40,
    45, 50, 100, 200 and 500 ms each rendered. So `write_drain_ms` is 25 here.
    Each step was walked once, so that number is the shortest wait that
    rendered and not one established to render every time. See
    docs/protocol/ble.md 1.4.

    Three properties of the render were watched on the bulb. It survived the
    link going down. It lit a bulb whose stored state was `off`, and
    `devStatus` kept reporting `on=false` through it. The stored brightness
    scales it: the same `FF FF FF` was dimmer at brightness 10 than at 100.

    What ends a render is the firmware asserting the state it stores, and the
    hold above is how long it waits. Measured against a stored state of on and
    green, with a white render over it: the bulb came back to green one minute
    after the write, to the second. Against a stored state of `off` the same
    render was still there several minutes later, and nothing was seen to end
    it: there is no lit state for the firmware to come back to. Both readings
    were taken with no `lan` and no `ble` traffic in between, since a read
    would be a candidate cause. A `lan` colour write does end a render, and
    that one is the write and not the timer.

    One host note, since it cost a session. On macOS, CoreBluetooth refuses to
    discover the descriptors of the commissioning characteristics this unit
    also carries, with `CBErrorDomain Code=8`. A client that fails the whole
    connection on that error never reaches the Govee service at all, and the
    unit reads as dead over `ble`. Tolerate the error per characteristic.

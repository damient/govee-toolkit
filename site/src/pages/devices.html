<section class="pagehead">
  <div class="shell list">
    {{crumbs}}
    <h1>{{devices_heading}}</h1>
    <p class="lede">{{t:devices.lede}}</p>
  </div>
</section>

<section class="slab">
  <div class="shell list">
    <div class="toolbar">
      <label class="search">
        <span class="visually-hidden">{{t:devices.search}}</span>
        <input type="search" placeholder="{{t:devices.placeholder}}" data-filter autocomplete="off">
      </label>
      <label class="category">
        <span class="visually-hidden">{{t:devices.category}}</span>
        <select data-filter-category hidden>
          {{devices_categories}}
        </select>
      </label>
      <p class="note" data-filter-count data-filter-scope="{{devices_scope}}" aria-live="polite"></p>
    </div>

    <div class="tablewrap">
      <table class="matrix matrix-list">
        <caption class="visually-hidden">{{t:devices.caption}}</caption>
        <thead>
          <tr>
            <th scope="col"><span class="visually-hidden">{{t:devices.shape}}</span></th>
            <th scope="col">{{t:devices.name}}</th>
            <th scope="col">{{t:devices.capabilities}}</th>
          </tr>
        </thead>
        <tbody data-rows>
{{devices_rows}}
        </tbody>
      </table>
    </div>

    <ul class="caps legend-caps">
        {{caps_legend}}
    </ul>
  </div>
</section>

<section class="slab tight">
  <div class="shell narrow">
    <h2>{{t:devices.more_title}}</h2>
    <p>{{t:devices.more_text}}</p>
    <a class="btn" href="{{base}}devices/add/">{{t:devices.more_cta}}</a>
  </div>
</section>

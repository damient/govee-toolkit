[files]
extend-exclude = [
  "tests/fixtures/lan-captures/**",
  "packages/rust/Cargo.lock",
  "*.pcap",
  # The dictionary is English: it reads every other language as typos.
  "**/site/content/de/**",
  "**/site/content/es/**",
  "**/site/content/fr/**",
  "**/site/content/it/**",
  "**/site/content/i18n/de.json",
  "**/site/content/i18n/es.json",
  "**/site/content/i18n/fr.json",
  "**/site/content/i18n/it.json",
]

[default]
# typos splits a SKU into words, so H61BA reads as "BA" and it asks for "BY".
# Skipping the SKU token keeps the correction live everywhere else, including
# in the prose of the same file, and covers the SKUs not listed yet.
# `PNGs` reads as "PN", and typos asks for "ON".
# `sACN` reads as "ACN", and typos asks for "CAN".
extend-ignore-re = ["\\bH[0-9A-Z]{4}\\b", "\\bPNGs\\b", "\\bsACN\\b"]
